<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>巴士到站時間預報</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            background-color: #f5f5f5;
            color: #222;
            font-family: 'Microsoft JhengHei', '微軟正黑體', 'Noto Sans TC', 'PingFang TC', sans-serif;
            min-height: 100vh;
            overflow-x: hidden
        }

        body.dark-mode {
            background-color: #0a0e27;
            color: #fff
        }

        body.fullscreen-mode {
            background-color: #fff;
            overflow: hidden
        }

        body.dark-mode.fullscreen-mode {
            background-color: #0d1117
        }

        body.dark-mode .header {
            background: linear-gradient(135deg, #141a3a, #0d1b3e 50%, #0b1636);
            box-shadow: 0 4px 20px rgba(0, 0, 0, .5)
        }

        body.dark-mode .header-title h1 { color: #fff }
        body.dark-mode .header-title .subtitle { color: rgba(255, 255, 255, .75) }
        body.dark-mode .header-time .current-time { color: #fff }
        body.dark-mode .header-time .current-date { color: rgba(255, 255, 255, .75) }
        body.dark-mode .controls { background: rgba(255, 255, 255, .05); border-bottom-color: rgba(255, 255, 255, .1) }
        body.dark-mode .status-bar { background: rgba(255, 255, 255, .03); color: rgba(255, 255, 255, .65); border-bottom-color: rgba(255, 255, 255, .05) }
        body.dark-mode .table-header { background: rgba(255, 255, 255, .06); color: rgba(255, 255, 255, .5); border-bottom-color: rgba(255, 255, 255, .12) }
        body.dark-mode .bus-row { background: rgba(255, 255, 255, .02) !important }
        body.dark-mode .bus-row:hover { background: rgba(255, 255, 255, .06) !important }
        body.dark-mode .stop-name { color: rgba(255, 255, 255, .6) }
        body.dark-mode .stop-name-en { color: rgba(255, 255, 255, .35) }
        body.dark-mode .dest-direction { color: #fff }
        body.dark-mode .eta-na { color: rgba(255, 255, 255, .3) }
        body.dark-mode .btn-toggle-fullscreen,
        body.dark-mode .btn-theme-toggle,
        body.dark-mode .btn-secondary { background: rgba(255, 255, 255, .08); color: rgba(255, 255, 255, .85); border-color: rgba(255, 255, 255, .18) }
        body.dark-mode .btn-toggle-fullscreen:hover,
        body.dark-mode .btn-theme-toggle:hover,
        body.dark-mode .btn-secondary:hover { background: rgba(255, 255, 255, .14) }
        body.dark-mode .modal { background: #0d1b3e; color: #fff }
        body.dark-mode .modal-header { background: rgba(255, 255, 255, .05); border-bottom-color: rgba(255, 255, 255, .12) }
        body.dark-mode .modal-header-title { color: #fff }
        body.dark-mode .modal-close-btn { color: rgba(255, 255, 255, .7) }
        body.dark-mode .modal-left { border-right-color: rgba(255, 255, 255, .12) }
        body.dark-mode .modal-label,
        body.dark-mode .modal-right-title,
        body.dark-mode .modal-footer { color: rgba(255, 255, 255, .65) }
        body.dark-mode .modal-footer { background: rgba(255, 255, 255, .05); border-top-color: rgba(255, 255, 255, .12) }
        body.dark-mode .modal-route-filter input,
        body.dark-mode #routeSelect { background: rgba(255, 255, 255, .06); color: #fff; border-color: rgba(255, 255, 255, .18) }
        body.dark-mode #routeSelect option { background: #0d1b3e; color: #fff }
        body.dark-mode .stop-list { border-color: rgba(255, 255, 255, .12); background: rgba(255, 255, 255, .03) }
        body.dark-mode .stop-list-item:hover { background: rgba(66, 165, 245, .18) }
        body.dark-mode .stop-list-item-main { color: #fff }
        body.dark-mode .stop-list-item-sub { color: rgba(255, 255, 255, .65) }
        body.dark-mode .direction-button { background: rgba(255, 255, 255, .06); color: rgba(255, 255, 255, .85); border-color: rgba(255, 255, 255, .18) }
        body.dark-mode .direction-button:hover { background: rgba(255, 255, 255, .12) }
        body.dark-mode .row-remove-btn { color: rgba(255, 255, 255, .4) }
        body.dark-mode .row-remove-btn:hover { color: #ef5350; background: rgba(239, 83, 80, .15) }
        body.dark-mode .eta-secondary { border-left-color: rgba(255, 255, 255, .15) }
        body.dark-mode .bus-row .row-accent { opacity: .85 }
        body.dark-mode .stop-name-alt { color: rgba(255, 255, 255, .35); border-top-color: rgba(255, 255, 255, .1) }
        body.dark-mode .stop-name-alt .alt-badge { background: rgba(239, 83, 80, .18); color: #EF5350 }

        body.fullscreen-mode .header,
        body.fullscreen-mode .controls,
        body.fullscreen-mode .status-bar,
        body.fullscreen-mode .footer,
        body.fullscreen-mode .table-header { display: none !important }

        body.fullscreen-mode .bus-rows-container {
            height: 100vh !important;
            max-height: 100vh !important;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            scrollbar-width: none;
            background: #fff
        }

        body.dark-mode.fullscreen-mode .bus-rows-container { background: #0d1117 }
        body.fullscreen-mode .bus-rows-container::-webkit-scrollbar { display: none }

        body.fullscreen-mode .bus-row {
            height: 20vh !important;
            min-height: 20vh !important;
            max-height: 20vh !important;
            padding: 0 3vw 0 0 !important;
            grid-template-columns: 24vw 1fr 12vw 24vw !important;
            flex-shrink: 0;
            border-bottom: none !important;
            position: relative
        }

        body.fullscreen-mode .row-accent { width: 8px !important }
        body.fullscreen-mode .remove-cell { display: none !important }
        body.fullscreen-mode .drag-handle { display: none !important }
        body.fullscreen-mode .route-number { font-size: clamp(5rem, 14vh, 16vw) !important; letter-spacing: -3px !important }
        body.fullscreen-mode .dest-direction { font-size: clamp(2rem, 6.5vh, 7vw) !important; font-weight: 700 !important; line-height: 1.05 !important }
        body.fullscreen-mode .stop-name { font-size: clamp(.9rem, 2.2vh, 2.5vw) !important; margin-top: 6px !important }
        body.fullscreen-mode .stop-name-en { font-size: clamp(.7rem, 1.6vh, 1.8vw) !important }
        body.fullscreen-mode .company-logo { max-height: clamp(2.5rem, 7vh, 6vw) !important; max-width: clamp(6rem, 14vw, 180px) !important }
        body.fullscreen-mode .company-tag { font-size: clamp(1rem, 2.5vh, 2.5vw) !important; padding: 8px 18px !important }
        body.fullscreen-mode .eta-primary .eta-min { font-size: clamp(4rem, 13vh, 15vw) !important }
        body.fullscreen-mode .eta-primary .eta-unit { font-size: clamp(1rem, 2.5vh, 2.5vw) !important }
        body.fullscreen-mode .eta-secondary .eta-min { font-size: clamp(1.5rem, 4vh, 4.5vw) !important }
        body.fullscreen-mode .eta-secondary .eta-unit { font-size: clamp(.75rem, 1.8vh, 2vw) !important }
        body.fullscreen-mode .eta-secondary { gap: 8px !important }
        body.fullscreen-mode .eta-cell { gap: clamp(12px, 2.5vw, 36px) !important }
        body.fullscreen-mode .eta-secondary { padding-left: clamp(12px, 2vw, 28px) !important; border-left-width: 3px !important }
        body.fullscreen-mode .stop-cell { padding: 0 clamp(12px, 2.5vw, 40px) !important; gap: 4px !important }
        body.fullscreen-mode .route-cell { padding-left: 16px !important }

        body.fullscreen-mode .bus-row::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 20px;
            right: 20px;
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, rgba(0, 0, 0, .08) 10%, rgba(0, 0, 0, .08) 90%, transparent 100%)
        }

        body.dark-mode.fullscreen-mode .bus-row::after {
            background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, .08) 10%, rgba(255, 255, 255, .08) 90%, transparent 100%)
        }

        .drag-handle {
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            color: #ccc;
            font-size: 18px;
            user-select: none;
            touch-action: none;
            transition: color .2s;
            padding: 0 4px
        }

        .drag-handle:hover { color: #777 }
        .drag-handle:active { cursor: grabbing; color: #444 }
        body.dark-mode .drag-handle { color: rgba(255, 255, 255, .15) }
        body.dark-mode .drag-handle:hover { color: rgba(255, 255, 255, .45) }

        .bus-row.dragging {
            position: fixed !important;
            z-index: 1000 !important;
            pointer-events: none !important;
            box-shadow: 0 16px 48px rgba(0, 0, 0, .2), 0 4px 12px rgba(0, 0, 0, .1) !important;
            opacity: .92 !important;
            border-radius: 8px !important;
            border: 2px solid #1976d2 !important;
            transition: box-shadow .2s !important;
            will-change: top
        }

        body.dark-mode .bus-row.dragging {
            box-shadow: 0 16px 48px rgba(0, 0, 0, .5), 0 4px 12px rgba(0, 0, 0, .3) !important;
            border-color: #42a5f5 !important;
            background: #151c34 !important
        }

        .drag-placeholder {
            border: 2px dashed #90caf9;
            border-radius: 6px;
            background: rgba(25, 118, 210, .06);
            transition: height .15s ease
        }

        body.dark-mode .drag-placeholder { background: rgba(66, 165, 245, .06); border-color: rgba(66, 165, 245, .3) }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .45);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200
        }

        .modal-backdrop.active { display: flex }

        .modal {
            background: #fff;
            border-radius: 12px;
            max-width: 960px;
            width: 94%;
            max-height: 82vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 16px 40px rgba(0, 0, 0, .3);
            overflow: hidden
        }

        .modal-header {
            padding: 14px 20px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fafafa;
            flex-shrink: 0
        }

        .modal-header-title { font-size: 18px; font-weight: 600; color: #333 }
        .modal-close-btn { border: none; background: transparent; font-size: 22px; cursor: pointer; color: #757575; padding: 4px 8px }

        .modal-body {
            display: grid;
            grid-template-columns: 1.1fr 1.3fr;
            padding: 16px 20px;
            column-gap: 16px;
            overflow-y: auto;
            flex: 1
        }

        .modal-left,
        .modal-right { display: flex; flex-direction: column; gap: 10px }
        .modal-left { border-right: 1px solid #eee; padding-right: 12px }
        .modal-right { padding-left: 4px }
        .modal-label { font-size: 14px; color: #616161; margin-bottom: 2px }
        .modal-route-filter { display: flex; flex-direction: column; gap: 6px }

        .modal-route-filter input {
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #cfcfcf;
            font-size: 14px;
            font-family: inherit
        }

        .modal-route-filter input:focus { outline: none; border-color: #42a5f5; box-shadow: 0 0 0 2px rgba(66, 165, 245, .25) }

        #routeSelect {
            width: 100%;
            border-radius: 6px;
            border: 1px solid #cfcfcf;
            padding: 4px;
            font-size: 14px;
            min-height: 200px;
            font-family: inherit
        }

        .direction-buttons { display: flex; gap: 8px }

        .direction-button {
            flex: 1;
            padding: 6px 8px;
            font-size: 13px;
            border-radius: 999px;
            border: 1px solid #bdbdbd;
            background: #fafafa;
            cursor: pointer;
            color: #424242;
            transition: all .2s;
            font-family: inherit
        }

        .direction-button.active { background: #1976d2; color: #fff; border-color: #1976d2 }
        .direction-button:hover { background: #e0e0e0 }

        .modal-load-stops-btn {
            padding: 7px 14px;
            border-radius: 6px;
            border: none;
            background: #1976d2;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            font-family: inherit
        }

        .modal-load-stops-btn:disabled { opacity: .5; cursor: default }
        .modal-right-title { font-size: 14px; color: #616161 }

        .stop-list {
            border-radius: 6px;
            border: 1px solid #e0e0e0;
            padding: 4px;
            flex: 1;
            overflow-y: auto;
            min-height: 200px;
            max-height: 380px
        }

        .stop-list-item { padding: 7px 8px; border-radius: 4px; cursor: pointer; transition: background .15s }
        .stop-list-item:hover { background: #e3f2fd }
        .stop-list-item-main { font-size: 14px; color: #212121 }
        .stop-list-item-sub { font-size: 12px; color: #757575; margin-top: 1px }
        .stop-list-empty { font-size: 13px; color: #9e9e9e; padding: 12px 8px }

        .company-selector { display: flex; gap: 6px; flex-wrap: wrap }

        .company-btn {
            padding: 5px 14px;
            font-size: 13px;
            border-radius: 999px;
            border: 1px solid #bdbdbd;
            background: #fafafa;
            cursor: pointer;
            color: #424242;
            transition: all .2s;
            font-weight: 600;
            font-family: inherit
        }

        .company-btn.active { background: #1976d2; color: #fff; border-color: #1976d2 }
        .company-btn:hover:not(.active) { background: #e0e0e0 }
        body.dark-mode .company-btn { background: rgba(255, 255, 255, .06); color: rgba(255, 255, 255, .85); border-color: rgba(255, 255, 255, .18) }
        body.dark-mode .company-btn:hover:not(.active) { background: rgba(255, 255, 255, .12) }

        .header {
            background: linear-gradient(135deg, #fff, #f3f3f3 40%, #e0e0e0);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, .08);
            position: sticky;
            top: 0;
            z-index: 100
        }

        .header-title { display: flex; align-items: center; gap: 20px }
        .header-title .icon { font-size: 48px }
        .header-title h1 { font-size: 38px; font-weight: 700; letter-spacing: 4px; color: #333 }
        .header-title .subtitle { font-size: 15px; color: #616161; margin-top: 4px }

        .header-time {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px
        }

        .header-time .current-time { font-size: 48px; font-weight: 700; font-variant-numeric: tabular-nums; color: #212121 }
        .header-time .current-date { font-size: 17px; color: #757575 }

        .btn-toggle-fullscreen,
        .btn-theme-toggle {
            padding: 6px 16px;
            font-size: 14px;
            border-radius: 999px;
            border: 1px solid #bdbdbd;
            background: #fff;
            color: #424242;
            cursor: pointer;
            transition: all .2s;
            font-family: inherit
        }

        .btn-toggle-fullscreen:hover,
        .btn-theme-toggle:hover { background: #e0e0e0 }

        .btn-secondary {
            background: #e3f2fd;
            color: #424242;
            border: 1px solid #bdbdbd;
            padding: 8px 18px;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all .2s;
            font-family: inherit
        }

        .btn-secondary:hover { background: #bbdefb }

        .controls {
            background: #fff;
            padding: 14px 40px;
            display: flex;
            gap: 14px;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 1px solid #e0e0e0
        }

        .controls button {
            padding: 10px 28px;
            font-size: 17px;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            transition: all .3s;
            letter-spacing: 1px
        }

        .btn-search { background: linear-gradient(135deg, #1976d2, #42a5f5); color: #fff }

        .btn-search:hover {
            background: linear-gradient(135deg, #1565c0, #2196f3);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(25, 118, 210, .4)
        }

        .status-bar {
            background: #fafafa;
            padding: 9px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: #757575;
            border-bottom: 1px solid #e0e0e0
        }

        .status-bar .status-indicator { display: flex; align-items: center; gap: 8px }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4caf50;
            animation: pulse 2s infinite
        }

        .status-dot.error { background: #f44336; animation: none }
        .status-dot.loading { background: #ff9800; animation: pulse .5s infinite }

        @keyframes pulse {
            0%, 100% { opacity: 1 }
            50% { opacity: .4 }
        }

        .table-header {
            display: grid;
            grid-template-columns: 32px 1fr 2fr 1fr 1.8fr 60px;
            padding: 12px 32px;
            background: #f0f0f0;
            font-size: 13px;
            font-weight: 700;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 3px;
            border-bottom: 2px solid #ddd;
            position: sticky;
            top: 100px;
            z-index: 50
        }

        .table-header > div { display: flex; align-items: center; justify-content: center }
        .table-header > div:nth-child(3) { justify-content: flex-start; padding-left: 20px }

        .bus-rows-container {
            max-height: calc(100vh - 280px);
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #bdbdbd transparent;
            position: relative
        }

        .bus-rows-container::-webkit-scrollbar { width: 6px }
        .bus-rows-container::-webkit-scrollbar-thumb { background: #bdbdbd; border-radius: 3px }
        body.dark-mode .bus-rows-container { scrollbar-color: #1565c0 transparent }
        body.dark-mode .bus-rows-container::-webkit-scrollbar-thumb { background: #1565c0 }

        .bus-row {
            display: grid;
            grid-template-columns: 32px 1fr 2fr 1fr 1.8fr 60px;
            padding: 16px 32px;
            background: #fff;
            align-items: center;
            border-bottom: 1px solid rgba(0, 0, 0, .06);
            position: relative
        }

        body.dark-mode .bus-row { border-bottom-color: rgba(255, 255, 255, .06) }

        .bus-row.row-enter {
            animation: fadeInRow .4s ease forwards;
            opacity: 0
        }

        @keyframes fadeInRow {
            from { opacity: 0; transform: translateY(8px) }
            to { opacity: 1; transform: translateY(0) }
        }

        .bus-row:hover { background: #f8fafc }
        body.dark-mode .bus-row:hover { background: rgba(255, 255, 255, .05) !important }

        .row-accent {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 5px;
            border-radius: 0 3px 3px 0
        }

        .row-accent.accent-ctb { background: linear-gradient(180deg, #FFE680, #FFDA44) }
        .row-accent.accent-kmb { background: linear-gradient(180deg, #EF5350, #C62828) }
        .row-accent.accent-lwb { background: linear-gradient(180deg, #FFA726, #E65100) }
        .row-accent.accent-nlb { background: linear-gradient(180deg, #66BB6A, #2E7D32) }
        .row-accent.accent-mtr { background: linear-gradient(180deg, #78909C, #455A64) }
        .row-accent.accent-night { background: linear-gradient(180deg, #7986CB, #283593) }
        .row-accent.accent-express { background: linear-gradient(180deg, #42A5F5, #1565C0) }
        .row-accent.accent-special { background: linear-gradient(180deg, #BA68C8, #6A1B9A) }
        .row-accent.accent-joint { background: linear-gradient(180deg, #EF5350, #FFDA44) }

        .route-cell { display: flex; align-items: center; justify-content: center }

        .route-number {
            font-family: 'Noto Sans HK', 'Arial', sans-serif;
            font-weight: 700;
            font-size: 72px;
            line-height: 1;
            letter-spacing: -1px
        }

        .route-co-ctb .route-number { color: #1976D2 }
        .route-co-kmb .route-number { color: #C62828 }
        .route-co-lwb .route-number { color: #E65100 }
        .route-co-nlb .route-number { color: #2E7D32 }
        .route-co-mtr .route-number { color: #455A64 }
        .route-type-night .route-number { color: #3949AB }
        .route-type-express .route-number { color: #1976D2 }
        .route-type-special .route-number { color: #7B1FA2 }

        body.dark-mode .route-co-ctb .route-number { color: #1976D2 }
        body.dark-mode .route-co-kmb .route-number { color: #EF5350 }
        body.dark-mode .route-co-lwb .route-number { color: #FFB74D }
        body.dark-mode .route-co-nlb .route-number { color: #81C784 }
        body.dark-mode .route-co-mtr .route-number { color: #90A4AE }
        body.dark-mode .route-type-night .route-number { color: #9FA8DA }
        body.dark-mode .route-type-express .route-number { color: #64B5F6 }
        body.dark-mode .route-type-special .route-number { color: #CE93D8 }

        .stop-cell { display: flex; flex-direction: column; gap: 4px; padding: 0 20px; justify-self: start }
        .dest-direction { font-size: 34px; font-weight: 700; color: #111; line-height: 1.1 }
        .stop-name { font-size: 14px; font-weight: 500; color: #888; line-height: 1.2 }
        .stop-name-en { font-size: 11px; color: #aaa; font-weight: 400; margin-top: 1px }

        .stop-name-alt {
            font-size: 12px;
            color: #aaa;
            margin-top: 3px;
            padding-top: 3px;
            border-top: 1px dashed #e0e0e0
        }

        .stop-name-alt .alt-badge {
            display: inline-block;
            font-size: 10px;
            padding: 1px 5px;
            border-radius: 3px;
            margin-right: 4px;
            background: #FFEBEE;
            color: #C62828
        }

        .company-cell { display: flex; align-items: center; justify-content: center }

        .company-logo {
            max-height: 42px;
            max-width: 110px;
            width: auto;
            object-fit: contain;
            display: block
        }

        .company-logo.logo-ctb { max-height: 72px; max-width: 160px }
        .company-logo.logo-nlb { max-height: 84px; max-width: 140px }

        .company-tag {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 5px 12px;
            border-radius: 6px;
            white-space: nowrap
        }

        .company-tag.ctb { background: #FFFDE7; color: #F9A825 }
        .company-tag.kmb { background: #FFEBEE; color: #C62828 }
        .company-tag.lwb { background: #FFF3E0; color: #E65100 }
        .company-tag.nlb { background: #E8F5E9; color: #2E7D32 }
        .company-tag.mtr { background: #ECEFF1; color: #455A64 }

        body.dark-mode .company-tag.ctb { background: rgba(255, 224, 130, .15); color: #FFE082 }
        body.dark-mode .company-tag.kmb { background: rgba(239, 83, 80, .12); color: #EF5350 }
        body.dark-mode .company-tag.lwb { background: rgba(255, 167, 38, .12); color: #FFB74D }
        body.dark-mode .company-tag.nlb { background: rgba(102, 187, 106, .12); color: #81C784 }
        body.dark-mode .company-tag.mtr { background: rgba(255, 255, 255, .08); color: #90A4AE }

        .logo-on-dark { background: rgba(255, 255, 255, .12); border-radius: 8px; padding: 4px 10px }

        .co-badge-group { display: flex; flex-direction: column; align-items: center; gap: 6px }
        .co-badge-group .company-logo { max-height: 28px; max-width: 90px }
        .co-badge-group .logo-ctb { max-height: 48px; max-width: 90px }

        .eta-cell { display: flex; align-items: center; justify-content: center; gap: 16px }

        .eta-primary {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            min-width: 90px
        }

        .eta-primary .eta-min { font-size: 54px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1 }
        .eta-primary .eta-unit { font-size: 17px; font-weight: 500; opacity: .55; margin-top: 2px }
        .eta-primary .eta-rmk { font-size: 11px; opacity: .5; margin-top: 2px }

        .eta-secondary {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 5px;
            border-left: 2px solid #e0e0e0;
            padding-left: 14px;
            min-width: 60px
        }

        .eta-secondary .eta-row { display: flex; align-items: baseline; gap: 3px }
        .eta-secondary .eta-min { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1 }
        .eta-secondary .eta-unit { font-size: 11px; font-weight: 500; opacity: .5 }
        .eta-secondary .eta-rmk { font-size: 9px; opacity: .45 }

        .eta-arriving { color: #2E7D32 }
        .eta-arriving .eta-min { animation: blink 1s infinite }
        .eta-soon { color: #E65100 }
        .eta-normal { color: #1976D2 }
        .eta-na { color: #bdbdbd; font-size: 18px; font-weight: 400 }

        body.dark-mode .eta-arriving { color: #81C784 }
        body.dark-mode .eta-soon { color: #FFB74D }
        body.dark-mode .eta-normal { color: #64B5F6 }
        body.dark-mode .eta-na { color: rgba(255, 255, 255, .25) }

        @keyframes blink {
            0%, 100% { opacity: 1 }
            50% { opacity: .4 }
        }

        .eta-cell.eta-updated .eta-primary { animation: etaPulse .6s ease }

        @keyframes etaPulse {
            0% { transform: scale(1) }
            30% { transform: scale(1.08) }
            100% { transform: scale(1) }
        }

        .remove-cell { display: flex; align-items: center; justify-content: center }

        .row-remove-btn {
            width: 34px;
            height: 34px;
            border: none;
            background: transparent;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            color: #bbb;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .2s
        }

        .row-remove-btn:hover { background: rgba(244, 67, 54, .1); color: #e53935 }

        .message-container { text-align: center; padding: 80px 40px }
        .message-container .icon { font-size: 64px; margin-bottom: 20px }
        .message-container .text { font-size: 26px; color: #616161 }
        .message-container .subtext { font-size: 17px; color: #9e9e9e; margin-top: 10px }

        @media(min-width:1920px) {
            .route-number { font-size: 88px }
            .dest-direction { font-size: 42px }
            .stop-name { font-size: 16px }
            .eta-primary .eta-min { font-size: 68px }
            .eta-secondary .eta-min { font-size: 26px }
            .company-logo.logo-ctb { max-height: 90px; max-width: 200px }
            .company-logo.logo-nlb { max-height: 100px; max-width: 170px }
        }

        @media(max-width:1300px) {
            .table-header,
            .bus-row { grid-template-columns: 28px 1fr 2fr 1fr 1.6fr 50px; padding-left: 24px; padding-right: 24px }
            .route-number { font-size: 58px }
            .dest-direction { font-size: 28px }
            .stop-name { font-size: 13px }
            .eta-primary .eta-min { font-size: 46px }
            .eta-secondary .eta-min { font-size: 18px }
            .company-logo { max-height: 34px; max-width: 90px }
            .company-logo.logo-ctb { max-height: 56px; max-width: 120px }
            .company-logo.logo-nlb { max-height: 64px; max-width: 110px }
        }

        @media(max-width:900px) {
            .table-header,
            .bus-row { grid-template-columns: 24px 100px 1fr 160px 44px; padding-left: 16px; padding-right: 16px }
            .table-header > div:nth-child(4),
            .bus-row .company-cell { display: none }
            .route-number { font-size: 44px }
            .dest-direction { font-size: 20px }
            .stop-name { font-size: 11px }
            .eta-primary .eta-min { font-size: 36px }
            .eta-secondary .eta-min { font-size: 16px }
            .controls { flex-direction: column; align-items: stretch }
            .header { flex-direction: column; gap: 10px }
            .header-time { text-align: center; align-items: center }
        }

        body.is-dragging { overflow: hidden !important }
        body.is-dragging .bus-rows-container { overflow: hidden !important }
    </style>
</head>

<body>
    <div class="header">
        <div class="header-title">
            <span class="icon">🚌</span>
            <div>
                <h1>巴士到站時間預報</h1>
                <div class="subtitle">Bus Estimated Time of Arrival</div>
            </div>
        </div>
        <div class="header-time">
            <div>
                <div class="current-time" id="currentTime">--:--:--</div>
                <div class="current-date" id="currentDate">----年--月--日</div>
            </div>
            <div style="display:flex;gap:8px;margin-top:4px;justify-content:flex-end">
                <button class="btn-theme-toggle" id="themeToggleBtn" type="button" onclick="toggleThemeMode()">深色模式</button>
                <button class="btn-toggle-fullscreen" id="fullscreenToggleBtn" onclick="toggleFullscreenMode()">全螢幕模式</button>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn-secondary" type="button" onclick="openStopSelector()">選擇路線 / 巴士站</button>
        <button class="btn-secondary" type="button" onclick="clearAllStops()" id="clearBtn" style="display:none;">清除所有站點</button>
        <button class="btn-search" onclick="currentStops.length > 0 ? manualRefresh() : null">查詢 / 重新整理</button>
    </div>

    <div class="status-bar">
        <div class="status-indicator">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">等待查詢...</span>
        </div>
        <div>
            <span id="lastUpdate">最後更新：--</span>&nbsp;|&nbsp;
            <span>自動更新：每15秒</span>&nbsp;|&nbsp;
            <span id="recordCount">顯示 0 條記錄</span>
        </div>
    </div>

    <div class="table-header">
        <div></div>
        <div>路線</div>
        <div>目的地 / 巴士站</div>
        <div>巴士公司</div>
        <div>預計到站</div>
        <div></div>
    </div>

    <div class="bus-rows-container" id="busRowsContainer">
        <div class="message-container">
            <div class="icon">🔍</div>
            <div class="text">請選擇路線及巴士站以查詢到站時間</div>
            <div class="subtext">按上方「選擇路線 / 巴士站」按鈕開始</div>
        </div>
    </div>

    <div class="modal-backdrop" id="stopSelectorModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-header-title">選擇路線及巴士站</div>
                <button class="modal-close-btn" type="button" onclick="closeStopSelector()">✕</button>
            </div>
            <div class="modal-body">
                <div class="modal-left">
                    <div class="modal-label">巴士公司</div>
                    <div class="company-selector">
                        <button type="button" class="company-btn active" data-co="CTB" onclick="selectCompany('CTB')">城巴</button>
                        <button type="button" class="company-btn" data-co="KMB" onclick="selectCompany('KMB')">九巴</button>
                        <button type="button" class="company-btn" data-co="LWB" onclick="selectCompany('LWB')">龍運</button>
                        <button type="button" class="company-btn" data-co="NLB" onclick="selectCompany('NLB')">嶼巴</button>
                    </div>
                    <div class="modal-route-filter">
                        <div class="modal-label">路線（輸入以篩選）</div>
                        <input type="text" id="routeFilterInput" placeholder="例如：1, 11, A21..." oninput="filterRouteOptions()">
                    </div>
                    <select id="routeSelect" size="9" onchange="onRouteSelectChange()"></select>
                    <div class="modal-label" id="directionLabel">方向</div>
                    <div class="direction-buttons" id="directionButtons">
                        <button type="button" class="direction-button" id="dirInboundBtn" onclick="setSelectedDirection('inbound')">往起點</button>
                        <button type="button" class="direction-button" id="dirOutboundBtn" onclick="setSelectedDirection('outbound')">往終點</button>
                    </div>
                    <button type="button" class="modal-load-stops-btn" id="loadStopsBtn" onclick="loadStopsForSelection()">載入巴士站</button>
                </div>
                <div class="modal-right">
                    <div class="modal-right-title" id="selectedRouteTitle">請先選擇巴士公司、路線及方向</div>
                    <div class="stop-list" id="stopList">
                        <div class="stop-list-empty">尚未載入巴士站。</div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">提示：點擊巴士站可新增/移除站點。拖動 ⠿ 可重新排序。ESC關閉。</div>
        </div>
    </div>

    <script>
    // ─── Constants ───────────────────────────────────────────────────────────────
    const JOINT_ROUTES = new Set([
        '101','102','104','105','106','107','108','109','110','111','112',
        '113','115','116','118','N121','170','171','182','182P','N182',
        '307','307P','N307','619','680','681','682','690'
    ]);

    const COMPANY_LOGOS = {
        CTB:  'https://www.citybus.com.hk/_common/images/logo.png',
        KMB:  'https://upload.wikimedia.org/wikipedia/en/thumb/b/b4/KowloonMotorBus.svg/3840px-KowloonMotorBus.svg.png',
        LWB:  'https://upload.wikimedia.org/wikipedia/en/thumb/f/f1/Long_Win_Bus_logo.svg/500px-Long_Win_Bus_logo.svg.png',
        NLB:  'https://www.td.gov.hk/filemanager/en/content_391/nlb_logo-color-v.png',
        MTR:  'https://upload.wikimedia.org/wikipedia/en/thumb/b/b9/HK_MTR_logo.svg/960px-HK_MTR_logo.svg.png',
        NWFB: 'https://www.citybus.com.hk/_common/images/logo.png'
    };

    const API = {
        CTB: {
            routeList:  'https://rt.data.gov.hk/v2/transport/citybus/route/CTB',
            routeStop:  (route, dir) => `https://rt.data.gov.hk/v2/transport/citybus/route-stop/CTB/${route}/${dir}`,
            stop:       id => `https://rt.data.gov.hk/v2/transport/citybus/stop/${id}`,
            eta:        (s, r) => `https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/${s}/${r}`
        },
        KMB: {
            routeList:  'https://data.etabus.gov.hk/v1/transport/kmb/route/',
            routeStop:  (r, d, st) => `https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${r}/${d}/${st || 1}`,
            stop:       id => `https://data.etabus.gov.hk/v1/transport/kmb/stop/${id}`,
            eta:        (s, r, st) => `https://data.etabus.gov.hk/v1/transport/kmb/eta/${s}/${r}/${st || 1}`
        },
        NLB: {
            routeList:  'https://rt.data.gov.hk/v1/transport/nlb/route.php?action=list',
            routeStop:  rid => `https://rt.data.gov.hk/v2/transport/nlb/stop.php?action=list&routeId=${rid}`,
            eta:        (s, rid) => `https://rt.data.gov.hk/v2/transport/nlb/stop.php?action=estimatedArrivals&routeId=${rid}&stopId=${s}&language=zh`
        }
    };

    const REFRESH_INTERVAL = 15000;
    const STORAGE_KEY = 'busEtaStops_v2';
    const LWB_ROUTE_PREFIXES = ['A','B','E','R','S'];

    // ─── State ───────────────────────────────────────────────────────────────────
    let refreshTimer       = null;
    let isFetching         = false;          // guard against overlapping fetches
    let stopNameCache      = {};
    let routeListCache     = {};
    let currentStops       = [];
    let explicitTheme      = null;
    let selectedDirection  = null;
    let selectedCompany    = 'CTB';
    let isFullscreenMode   = false;

    // renderedRows: Map<stopKey, { element: HTMLElement, etaSignature: string }>
    const renderedRows = new Map();

    // ─── Helpers ─────────────────────────────────────────────────────────────────
    function isLwbRoute(r) {
        r = r.toUpperCase();
        return LWB_ROUTE_PREFIXES.some(p => r.startsWith(p) && /^[A-Z]\d/.test(r));
    }

    function makeStopKey(sd) {
        const dir = sd.company === 'NLB' ? 'nlb' : (sd.direction || 'none');
        const rid = sd.company === 'NLB' ? (sd.nlbRouteId || sd.routeId) : sd.routeId;
        return `${sd.company}||${rid}||${sd.stopId}||${dir}`;
    }

    // ─── Logo cache ──────────────────────────────────────────────────────────────
    const logoLoadCache = {};
    function testLogoUrl(url) {
        if (url in logoLoadCache) return Promise.resolve(logoLoadCache[url]);
        return new Promise(r => {
            const i = new Image();
            i.onload  = () => { logoLoadCache[url] = true;  r(true); };
            i.onerror = () => { logoLoadCache[url] = false; r(false); };
            i.src = url;
        });
    }
    Object.values(COMPANY_LOGOS).forEach(u => testLogoUrl(u));

    // ─── Storage ─────────────────────────────────────────────────────────────────
    function saveStopsToStorage() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(currentStops.map(s => ({
                stopId:       s.stopId,
                routeId:      s.routeId,
                nlbRouteId:   s.nlbRouteId,
                direction:    s.direction,
                company:      s.company,
                serviceType:  s.serviceType,
                nlbDest:      s.nlbDest || '',
                stopInfoCache: s.stopInfo,
                altStopName:  s.altStopName || null
            }))));
        } catch (e) {}
    }

    function loadStopsFromStorage() {
        try {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (!stored) return false;
            const data = JSON.parse(stored);
            if (!Array.isArray(data) || !data.length) return false;
            currentStops = data.map(s => ({
                stopId:      s.stopId,
                routeId:     s.routeId,
                nlbRouteId:  s.nlbRouteId  || null,
                direction:   s.direction   || null,
                company:     s.company,
                serviceType: s.serviceType || 1,
                nlbDest:     s.nlbDest     || '',
                stopInfo:    s.stopInfoCache || null,
                altStopName: s.altStopName  || null
            }));
            updateClearButton();
            return true;
        } catch (e) { return false; }
    }

    // ─── Clock ───────────────────────────────────────────────────────────────────
    function updateClock() {
        const now = new Date();
        document.getElementById('currentTime').textContent =
            now.toLocaleTimeString('zh-HK', { hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false });
        const days = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
        document.getElementById('currentDate').textContent =
            `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${days[now.getDay()]}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ─── Theme ───────────────────────────────────────────────────────────────────
    function applyTheme(t) {
        document.body.classList.toggle('dark-mode', t === 'dark');
        const b = document.getElementById('themeToggleBtn');
        if (b) b.textContent = t === 'dark' ? '淺色模式' : '深色模式';
    }

    function loadThemePreference() {
        const s = localStorage.getItem('busEtaTheme');
        if (s === 'light' || s === 'dark') { explicitTheme = s; applyTheme(s); }
        else applyTheme(window.matchMedia && window.matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
        if (window.matchMedia)
            window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change', e => {
                if (!explicitTheme) applyTheme(e.matches ? 'dark' : 'light');
            });
    }

    function toggleThemeMode() {
        const next = document.body.classList.contains('dark-mode') ? 'light' : 'dark';
        explicitTheme = next;
        localStorage.setItem('busEtaTheme', next);
        applyTheme(next);
    }

    // ─── Status bar ──────────────────────────────────────────────────────────────
    function setStatus(state, text) {
        const d = document.getElementById('statusDot');
        d.className = 'status-dot';
        if (state === 'loading') d.classList.add('loading');
        if (state === 'error')   d.classList.add('error');
        document.getElementById('statusText').textContent = text;
    }

    // ─── Stop-name helpers ───────────────────────────────────────────────────────
    async function fetchStopNameFromCo(id, co) {
        const key = `${co}_${id}`;
        if (stopNameCache[key]) return stopNameCache[key];
        try {
            const url = (co === 'KMB' || co === 'LWB') ? API.KMB.stop(id) : API.CTB.stop(id);
            const r = await fetch(url);
            const d = await r.json();
            if (d.data && d.data.name_tc) {
                const info = { name_tc: d.data.name_tc, name_en: d.data.name_en || '' };
                stopNameCache[key] = info;
                return info;
            }
        } catch (e) {}
        return null;
    }

    async function fetchStopNames(id, primaryCo, isJoint) {
        if (primaryCo === 'NLB') return { primary: { name_tc: id, name_en: '' }, alt: null };
        const primary = await fetchStopNameFromCo(id, primaryCo) || { name_tc: id, name_en: '' };
        if (!isJoint) return { primary, alt: null };
        const otherCo = (primaryCo === 'CTB' || primaryCo === 'NWFB') ? 'KMB' : 'CTB';
        const other = await fetchStopNameFromCo(id, otherCo);
        if (other && other.name_tc && other.name_tc !== primary.name_tc)
            return { primary, alt: { ...other, co: otherCo } };
        return { primary, alt: null };
    }

    async function fetchStopName(id, company) {
        const co = (company || 'CTB').toUpperCase();
        if (co === 'NLB') return { name_tc: id, name_en: '' };
        return await fetchStopNameFromCo(id, co) || { name_tc: id, name_en: '' };
    }

    // ─── Utility ─────────────────────────────────────────────────────────────────
    function getCompanyName(c) {
        return { CTB:'城巴', NWFB:'城巴', KMB:'九巴', LWB:'龍運', NLB:'嶼巴', MTR:'港鐵巴士' }[c] || c;
    }
    function getCompanyClass(c) {
        return { CTB:'ctb', NWFB:'ctb', KMB:'kmb', LWB:'lwb', NLB:'nlb', MTR:'mtr' }[c] || 'ctb';
    }

    function showMessage(icon, text, sub) {
        const container = document.getElementById('busRowsContainer');
        // Clear rendered rows map since we're wiping the DOM
        renderedRows.clear();
        container.innerHTML = `<div class="message-container">
            <div class="icon">${icon}</div>
            <div class="text">${text}</div>
            ${sub ? `<div class="subtext">${sub}</div>` : ''}
        </div>`;
        document.getElementById('recordCount').textContent = '顯示 0 條記錄';
    }

    function getRouteColorClass(rn, co) {
        const r = rn.toUpperCase(), c = (co || '').toUpperCase();
        if (c === 'LWB' || (c === 'KMB' && isLwbRoute(r))) return 'route-co-lwb';
        if (r.startsWith('N')) return 'route-type-night';
        if (r.endsWith('X') && !isLwbRoute(r)) return 'route-type-express';
        if (r.startsWith('R') && !isLwbRoute(r)) return 'route-type-special';
        switch (c) {
            case 'CTB': case 'NWFB': return 'route-co-ctb';
            case 'KMB': return 'route-co-kmb';
            case 'NLB': return 'route-co-nlb';
            case 'MTR': return 'route-co-mtr';
            default:    return 'route-co-ctb';
        }
    }

    function getAccentClass(rn, co, isJoint) {
        if (isJoint) return 'accent-joint';
        const r = rn.toUpperCase(), c = (co || '').toUpperCase();
        if (c === 'LWB' || (c === 'KMB' && isLwbRoute(r))) return 'accent-lwb';
        if (r.startsWith('N')) return 'accent-night';
        if (r.endsWith('X') && !isLwbRoute(r)) return 'accent-express';
        if (r.startsWith('R') && !isLwbRoute(r)) return 'accent-special';
        switch (c) {
            case 'CTB': case 'NWFB': return 'accent-ctb';
            case 'KMB': return 'accent-kmb';
            case 'NLB': return 'accent-nlb';
            case 'MTR': return 'accent-mtr';
            default:    return 'accent-ctb';
        }
    }

    // ─── ETA logic ───────────────────────────────────────────────────────────────
    /**
     * Returns a stable string signature for an array of ETA items.
     * We floor each ETA to the nearest minute so minor sub-second drift
     * does NOT trigger a spurious "changed" signal every cycle.
     */
    function getEtaSignature(etas) {
        if (!etas || !etas.length) return 'NONE';
        return etas
            .slice()
            .sort((a, b) => (a.eta_seq || 0) - (b.eta_seq || 0))
            .map(e => {
                if (!e.eta) return 'NA';
                // floor to nearest 30 s to avoid jitter
                const floored = Math.floor(new Date(e.eta).getTime() / 30000) * 30000;
                return `${floored}|${e.rmk_tc || ''}`;
            })
            .join(';;');
    }

    function getEtaInfo(item) {
        if (!item.eta) return { cls: 'eta-na', txt: '--', diff: null, rmk: '' };
        const diff = Math.floor((new Date(item.eta) - Date.now()) / 60000);
        let cls, txt;
        if (diff <= 0)       { cls = 'eta-arriving'; txt = '到站'; }
        else if (diff <= 3)  { cls = 'eta-arriving'; txt = diff; }
        else if (diff <= 10) { cls = 'eta-soon';     txt = diff; }
        else                 { cls = 'eta-normal';   txt = diff; }
        return { cls, txt, diff, rmk: item.rmk_tc || '' };
    }

    function buildEtaCellContent(etas) {
        if (!etas || !etas.length) return '<span class="eta-na">暫無班次</span>';
        const sorted = etas
            .filter(e => e.eta)
            .sort((a, b) => (a.eta_seq || 0) - (b.eta_seq || 0))
            .slice(0, 4);
        if (!sorted.length) return '<span class="eta-na">暫無班次</span>';

        const p = sorted[0], sec = sorted.slice(1);
        const pi = getEtaInfo(p);

        let h = `<div class="eta-primary ${pi.cls}">`;
        if (pi.diff !== null && pi.diff <= 0) {
            h += `<span class="eta-min">${pi.txt}</span>`;
        } else {
            h += `<span class="eta-min">${pi.txt}</span><span class="eta-unit">分鐘</span>`;
        }
        if (pi.rmk) h += `<span class="eta-rmk">${pi.rmk}</span>`;
        h += '</div>';

        if (sec.length) {
            h += '<div class="eta-secondary">';
            sec.forEach(item => {
                const info = getEtaInfo(item);
                h += `<div class="eta-row ${info.cls}">`;
                if (info.diff !== null && info.diff <= 0) {
                    h += `<span class="eta-min">${info.txt}</span>`;
                } else {
                    h += `<span class="eta-min">${info.txt}</span><span class="eta-unit">分</span>`;
                }
                if (info.rmk) h += `<span class="eta-rmk">${info.rmk}</span>`;
                h += '</div>';
            });
            h += '</div>';
        }
        return h;
    }

    // In-place update of just the ETA cell in an existing row
    function updateEtaCellInRow(rowEl, etas) {
        const cell = rowEl.querySelector('.eta-cell');
        if (!cell) return;
        cell.innerHTML = buildEtaCellContent(etas);
        // Trigger pulse animation
        cell.classList.remove('eta-updated');
        void cell.offsetWidth; // reflow
        cell.classList.add('eta-updated');
        setTimeout(() => cell.classList.remove('eta-updated'), 600);
    }

    // ─── Remove stop ─────────────────────────────────────────────────────────────
    function removeStopByKey(key) {
        const idx = currentStops.findIndex(s => makeStopKey(s) === key);
        if (idx < 0) return;
        currentStops.splice(idx, 1);
        saveStopsToStorage();
        updateClearButton();

        if (renderedRows.has(key)) {
            renderedRows.get(key).element.remove();
            renderedRows.delete(key);
        }

        if (!currentStops.length) {
            showMessage('🔍', '請選擇路線及巴士站以查詢到站時間', '按上方按鈕開始');
            stopAutoRefresh();

            document.getElementById('recordCount').textContent = `顯示 ${currentStops.length} 個站點`;
        }
    }

    // ─── ETA grouping ────────────────────────────────────────────────────────────
    function groupEta(etaData, dirFilter, isNlb, nlbDest) {
        const g = {};
        etaData.forEach(item => {
            const n = isNlb || (item.co || '').toUpperCase() === 'NLB';
            if (!n && dirFilter) {
                if (dirFilter === 'inbound'  && item.dir !== 'I') return;
                if (dirFilter === 'outbound' && item.dir !== 'O') return;
            }
            const k = `${item.route}:${item.dir || 'O'}`;
            if (!g[k]) {
                g[k] = {
                    route:   item.route,
                    dir:     item.dir || 'O',
                    co:      item.co  || 'CTB',
                    dest_tc: item.dest_tc || (n ? (nlbDest || '') : ''),
                    stop:    item.stop,
                    etas:    []
                };
            }
            if (item.dest_tc && !g[k].dest_tc) g[k].dest_tc = item.dest_tc;
            if (item.eta) {
                g[k].etas.push({
                    eta:     item.eta,
                    rmk_tc:  item.rmk_tc || '',
                    eta_seq: item.eta_seq || 0
                });
            }
        });

        Object.values(g).forEach(e => {
            e.etas.sort((a, b) => new Date(a.eta) - new Date(b.eta));
            e.etas.forEach((x, i) => x.eta_seq = i + 1);
            // De-duplicate ETAs within 30 s of each other
            e.etas = e.etas.filter((x, i, a) =>
                i === 0 || Math.abs(new Date(x.eta) - new Date(a[i-1].eta)) > 30000
            );
        });

        return Object.values(g).sort((a, b) => {
            const an = parseInt(a.route) || 0, bn = parseInt(b.route) || 0;
            return an !== bn ? an - bn : a.route.localeCompare(b.route);
        });
    }

    // ─── API fetchers ─────────────────────────────────────────────────────────────
    async function fetchCtbEta(s, r) {
        try {
            const res = await fetch(API.CTB.eta(s, r));
            if (!res.ok) return [];
            const d = await res.json();
            return (d.data || []).map(x => ({ ...x, co: x.co || 'CTB' }));
        } catch { return []; }
    }

    async function fetchKmbEta(s, r, st) {
        try {
            const res = await fetch(API.KMB.eta(s, r, st || 1));
            if (!res.ok) return [];
            const d = await res.json();
            return (d.data || []).map(x => ({ ...x, co: x.co || 'KMB' }));
        } catch { return []; }
    }

    async function fetchNlbEta(s, rid, rno, nd) {
        try {
            const res = await fetch(API.NLB.eta(s, rid));
            if (!res.ok) return [];
            const d = await res.json();
            return (d.estimatedArrivals || []).map((x, i) => ({
                route:   rno,
                dir:     'O',
                co:      'NLB',
                dest_tc: x.destination_zh || x.destination_tc || x.destination || nd || '',
                stop:    s,
                eta:     x.estimatedArrivalTime,
                rmk_tc:  x.remarks_zh || x.remarks_tc || x.remarks || '',
                eta_seq: i + 1
            }));
        } catch { return []; }
    }

    async function fetchJointEta(sd) {
        const co    = sd.company;
        const route = sd.routeId.toUpperCase();
        const stopId = sd.stopId;

        if (co === 'NLB')
            return fetchNlbEta(stopId, sd.nlbRouteId || route, sd.routeId, sd.nlbDest || '');
        if (co === 'LWB')
            return fetchKmbEta(stopId, route, sd.serviceType);
        if (JOINT_ROUTES.has(route)) {
            const [c, k] = await Promise.all([
                fetchCtbEta(stopId, route),
                fetchKmbEta(stopId, route, sd.serviceType)
            ]);
            return [...c, ...k];
        }
        if (co === 'CTB')  return fetchCtbEta(stopId, route);
        if (co === 'KMB')  return fetchKmbEta(stopId, route, sd.serviceType);
        return [];
    }

    // ─── Timer management ────────────────────────────────────────────────────────
    function stopAutoRefresh() {
        if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
    }

    function startAutoRefresh() {
        stopAutoRefresh();
        refreshTimer = setInterval(fetchMultiETA, REFRESH_INTERVAL);
    }

    // Manual button press: reset the timer so the next auto-tick is 15 s away
    function manualRefresh() {
        if (!currentStops.length) return;
        stopAutoRefresh();
        fetchMultiETA();          // fetchMultiETA will call startAutoRefresh() on success
    }

    // ─── Core fetch & render ─────────────────────────────────────────────────────
    async function fetchMultiETA() {
        if (!currentStops.length) {
            showMessage('⚠️', '請先選擇路線及巴士站', '按「選擇路線 / 巴士站」按鈕開始。');
            setStatus('error', '尚未選擇');
            return;
        }

        // Prevent overlapping fetches
        if (isFetching) return;
        isFetching = true;

        // Pause auto-refresh while fetching to avoid stacking
        stopAutoRefresh();

        setStatus('loading', `正在查詢 ${currentStops.length} 個站點...`);

        try {
            // ── 1. Fetch ETA + stop names for every saved stop in parallel ──────
            const results = await Promise.all(currentStops.map(async sd => {
                try {
                    const isNlb   = sd.company === 'NLB';
                    const isJoint = !isNlb && JOINT_ROUTES.has(sd.routeId.toUpperCase());

                    // Resolve stop names (cached after first fetch)
                    let stopNames;
                    if (sd.stopInfo) {
                        let alt = sd.altStopName || null;
                        if (isJoint && !alt) {
                            const oCo = (sd.company === 'CTB' || sd.company === 'NWFB') ? 'KMB' : 'CTB';
                            const o   = await fetchStopNameFromCo(sd.stopId, oCo);
                            if (o && o.name_tc !== sd.stopInfo.name_tc) alt = { ...o, co: oCo };
                            sd.altStopName = alt;
                        }
                        stopNames = { primary: sd.stopInfo, alt };
                    } else {
                        const names  = await fetchStopNames(sd.stopId, sd.company, isJoint);
                        sd.stopInfo  = names.primary;
                        sd.altStopName = names.alt;
                        stopNames    = names;
                    }

                    // Fresh ETA data every call
                    const etaData = await fetchJointEta(sd);

                    return {
                        stopKey:    makeStopKey(sd),
                        routeId:    sd.routeId,
                        nlbRouteId: sd.nlbRouteId || null,
                        direction:  sd.direction,
                        company:    sd.company,
                        stopNames,
                        nlbDest:    sd.nlbDest || '',
                        etaData
                    };
                } catch {
                    return null;
                }
            }));

            const validResults = results.filter(r => r !== null);

            if (!validResults.length) {
                showMessage('🚏', '所有站點均無資料', '請檢查路線及站點');
                setStatus('error', '無資料');
                return;
            }

            // ── 2. Determine whether the container currently holds rows ──────────
            const container = document.getElementById('busRowsContainer');
            const hasMessage = !!container.querySelector('.message-container');

            if (hasMessage) {
                // First render: wipe message, build all rows fresh
                container.innerHTML = '';
                renderedRows.clear();
            }

            // ── 3. Smart update: diff existing rows vs new data ──────────────────
            //    Build a flat ordered list of (stopKey, entry, stopNames, isJoint)
            const desiredRows = [];   // [{stopKey, entry, stopNames, isJoint}]

            for (const result of validResults) {
                const isNlb   = result.company === 'NLB';
                const isJoint = !isNlb && JOINT_ROUTES.has(result.routeId.toUpperCase());
                const entries = groupEta(result.etaData, result.direction, isNlb, result.nlbDest);

                for (const entry of entries) {
                    desiredRows.push({
                        stopKey:   result.stopKey,
                        entry,
                        stopNames: result.stopNames,
                        isJoint
                    });
                }
            }

            // Keys that should exist in the DOM after this update
            const desiredKeySet = new Set(desiredRows.map(r => r.stopKey));

            // Remove stale rows
            for (const [key, data] of renderedRows) {
                if (!desiredKeySet.has(key)) {
                    data.element.remove();
                    renderedRows.delete(key);
                }
            }

            // Add new rows / update existing ones in order
            for (const { stopKey, entry, stopNames, isJoint } of desiredRows) {
                const newSig = getEtaSignature(entry.etas);

                if (renderedRows.has(stopKey)) {
                    // Row already in DOM — only touch ETA cell if data changed
                    const cached = renderedRows.get(stopKey);
                    if (cached.etaSignature !== newSig) {
                        updateEtaCellInRow(cached.element, entry.etas);
                        cached.etaSignature = newSig;
                    }
                    // Ensure row is appended in correct order (move to end if needed)
                    container.appendChild(cached.element);
                } else {
                    // New row
                    const rowEl = await buildBusRow(entry, stopNames, true, stopKey, isJoint);
                    container.appendChild(rowEl);
                    renderedRows.set(stopKey, { element: rowEl, etaSignature: newSig });
                }
            }

            // ── 4. Fallback if container is still empty ──────────────────────────
            if (!container.children.length) {
                showMessage('🚏', '暫無到站資料', '所選站點目前沒有巴士到站資訊');
            }

            // ── 5. Update status bar ─────────────────────────────────────────────
            document.getElementById('lastUpdate').textContent =
                `最後更新：${new Date().toLocaleTimeString('zh-HK', { hour12: false })}`;
            document.getElementById('recordCount').textContent =
                `顯示 ${currentStops.length} 個站點`;
            setStatus('ok', `已更新 ${validResults.length}/${currentStops.length} 個站點`);

        } catch (err) {
            showMessage('❌', '查詢失敗', err.message);
            setStatus('error', `查詢失敗：${err.message}`);
        } finally {
            isFetching = false;
            // Always restart auto-refresh after each cycle (success or fail)
            if (currentStops.length) startAutoRefresh();
        }
    }

    async function loadRouteList(co) {
        const apiCo = co === 'LWB' ? 'KMB' : co;
        if (routeListCache[co]) { populateRouteSelect(routeListCache[co], co); return; }

        const sel = document.getElementById('routeSelect');
        sel.innerHTML = '<option disabled>載入中...</option>';

        try {
            if (apiCo === 'CTB') {
                const r    = await fetch(API.CTB.routeList);
                const d    = await r.json();
                const list = (d.data || []).map(x => ({
                    route: x.route, orig_tc: x.orig_tc, dest_tc: x.dest_tc, co: 'CTB'
                }));
                routeListCache.CTB = list;
                populateRouteSelect(list, 'CTB');

            } else if (apiCo === 'KMB') {
                if (!routeListCache._KMB_RAW) {
                    const r = await fetch(API.KMB.routeList);
                    const d = await r.json();
                    routeListCache._KMB_RAW = d.data || [];
                }
                const raw = routeListCache._KMB_RAW;
                const kR = [], lR = [], sK = {}, sL = {};
                raw.forEach(x => {
                    if (isLwbRoute(x.route)) {
                        if (!sL[x.route]) {
                            sL[x.route] = true;
                            lR.push({ route: x.route, orig_tc: x.orig_tc, dest_tc: x.dest_tc,
                                      co: 'LWB', service_type: x.service_type, bound: x.bound });
                        }
                    } else {
                        if (!sK[x.route]) {
                            sK[x.route] = true;
                            kR.push({ route: x.route, orig_tc: x.orig_tc, dest_tc: x.dest_tc,
                                      co: 'KMB', service_type: x.service_type, bound: x.bound });
                        }
                    }
                });
                routeListCache._KMB_FULL = raw;
                if (co === 'KMB') { routeListCache.KMB = kR; populateRouteSelect(kR, 'KMB'); }
                if (co === 'LWB') { routeListCache.LWB = lR; populateRouteSelect(lR, 'LWB'); }
                if (co === 'KMB' && !routeListCache.LWB) routeListCache.LWB = lR;
                if (co === 'LWB' && !routeListCache.KMB) routeListCache.KMB = kR;

            } else if (apiCo === 'NLB') {
                const r    = await fetch(API.NLB.routeList);
                const d    = await r.json();
                const list = (d.routes || []).map(x => ({
                    route: x.routeNo, orig_tc: x.routeName_c || x.routeNo,
                    dest_tc: x.routeName_c || '', co: 'NLB', nlbRouteId: x.routeId
                }));
                routeListCache.NLB = list;
                populateRouteSelect(list, 'NLB');
            }
        } catch {
            sel.innerHTML = '<option disabled>載入失敗</option>';
        }
    }

    function populateRouteSelect(list, co) {
        const s = document.getElementById('routeSelect');
        s.innerHTML = '';
        [...list]
            .sort((a, b) => {
                const an = parseInt(a.route) || 0, bn = parseInt(b.route) || 0;
                return an !== bn ? an - bn : a.route.localeCompare(b.route);
            })
            .forEach(r => {
                const o = document.createElement('option');
                o.value = r.route;
                o.textContent = co === 'NLB'
                    ? `${r.route} — ${r.orig_tc}`
                    : `${r.route} — ${r.orig_tc || ''} ↔ ${r.dest_tc || ''}`;
                o.dataset.origTc = r.orig_tc || '';
                o.dataset.destTc = r.dest_tc || '';
                o.dataset.co     = co;
                if (r.nlbRouteId) o.dataset.nlbRouteId = r.nlbRouteId;
                s.appendChild(o);
            });
    }

    async function loadStopsForSelection() {
        const sel  = document.getElementById('routeSelect');
        const btn  = document.getElementById('loadStopsBtn');
        const list = document.getElementById('stopList');
        const title = document.getElementById('selectedRouteTitle');
        const opt  = sel.options[sel.selectedIndex];
        const co   = selectedCompany;

        if (!opt) { list.innerHTML = '<div class="stop-list-empty">請先選擇路線。</div>'; return; }
        if (co !== 'NLB' && !selectedDirection) {
            list.innerHTML = '<div class="stop-list-empty">請先選擇方向。</div>'; return;
        }

        const route = opt.value;
        if (btn) btn.disabled = true;
        list.innerHTML = '<div class="stop-list-empty">正在載入...</div>';

        try {
            if (co === 'CTB') {
                const r = await fetch(API.CTB.routeStop(route, selectedDirection));
                if (!r.ok) { list.innerHTML = '<div class="stop-list-empty">載入失敗</div>'; return; }
                const d = await r.json();
                const stops = d.data || [];
                if (!stops.length) { list.innerHTML = '<div class="stop-list-empty">此方向沒有巴士站資料。</div>'; return; }
                list.innerHTML = '';
                for (const s of stops) {
                    const info = await fetchStopName(s.stop, 'CTB');
                    appendStopItem(list, s.stop, route, info, 'CTB', null, null, null);
                }

            } else if (co === 'KMB' || co === 'LWB') {
                let st = 1;
                if (routeListCache._KMB_FULL) {
                    const bound = selectedDirection === 'inbound' ? 'I' : 'O';
                    const m = routeListCache._KMB_FULL.find(x => x.route === route && x.bound === bound);
                    if (m) st = m.service_type || 1;
                }
                const r = await fetch(API.KMB.routeStop(route, selectedDirection, st));
                if (!r.ok) { list.innerHTML = '<div class="stop-list-empty">載入失敗</div>'; return; }
                const d = await r.json();
                const stops = d.data || [];
                if (!stops.length) { list.innerHTML = '<div class="stop-list-empty">此方向沒有巴士站資料。</div>'; return; }
                list.innerHTML = '';
                for (const s of stops) {
                    const info = await fetchStopName(s.stop, 'KMB');
                    appendStopItem(list, s.stop, route, info, co, st, null, null);
                }

            } else if (co === 'NLB') {
                const nid = opt.dataset.nlbRouteId || '';
                const nd  = opt.dataset.destTc || opt.dataset.origTc || route;
                if (!nid) { list.innerHTML = '<div class="stop-list-empty">無法取得路線ID。</div>'; return; }
                const r = await fetch(API.NLB.routeStop(nid));
                if (!r.ok) { list.innerHTML = '<div class="stop-list-empty">載入失敗</div>'; return; }
                const d = await r.json();
                const stops = d.stops || [];
                if (!stops.length) { list.innerHTML = '<div class="stop-list-empty">沒有巴士站資料。</div>'; return; }
                list.innerHTML = '';
                for (const s of stops) {
                    const ntc = s.stopName_zh || s.stopName_c || s.stopId || '';
                    const nen = s.stopName_en || s.stopName_e || '';
                    const sid = s.stopId || s.stop || '';
                    const info = { name_tc: ntc, name_en: nen };
                    stopNameCache[`NLB_${sid}`] = info;
                    appendStopItem(list, sid, route, info, 'NLB', null, nid, nd);
                }
            }

            if (title) title.textContent = selectedCompany === 'NLB'
                ? `已選路線：${route}（${opt.dataset.origTc || ''}）`
                : `已選路線：${route}（${opt.dataset.origTc || ''} ↔ ${opt.dataset.destTc || ''}）`;

        } catch {
            list.innerHTML = '<div class="stop-list-empty">載入錯誤。</div>';
        } finally {
            if (btn) btn.disabled = false;
        }
    }

    function appendStopItem(container, sid, route, info, company, st, nrid, nd) {
        const item = document.createElement('div');
        item.className = 'stop-list-item';
        item.onclick   = () => selectStopFromModal(sid, route, info, company, st, nrid, nd);
        item.innerHTML = `<div class="stop-list-item-main">${info.name_tc || sid}</div>
                          <div class="stop-list-item-sub">${info.name_en || ''} （站號：${sid}）</div>`;
        container.appendChild(item);
    }

    async function selectStopFromModal(sid, rno, si, co, st, nrid, nd) {
        const dir = co === 'NLB' ? null : selectedDirection;
        const sd  = {
            stopId:      sid,
            routeId:     rno,
            nlbRouteId:  nrid || null,
            direction:   dir,
            company:     co || selectedCompany,
            serviceType: st || 1,
            nlbDest:     nd || '',
            stopInfo:    si || await fetchStopName(sid, co),
            altStopName: null
        };

        const key = makeStopKey(sd);
        const idx = currentStops.findIndex(s => makeStopKey(s) === key);

        if (idx >= 0) {
            // Toggle off: remove
            currentStops.splice(idx, 1);
        } else {
            currentStops.push(sd);
        }

        saveStopsToStorage();
        closeStopSelector();
        updateClearButton();

        // Full re-render since stop list changed
        renderedRows.clear();
        const container = document.getElementById('busRowsContainer');
        container.innerHTML = '';

        if (currentStops.length > 0) {
            stopAutoRefresh();
            fetchMultiETA();   // will call startAutoRefresh() internally
        } else {
            showMessage('🔍', '請選擇路線及巴士站以查詢到站時間', '按上方按鈕開始');
            stopAutoRefresh();
        }
    }

    // ─── Drag & Drop ─────────────────────────────────────────────────────────────
    let isDragging = false, dragState = null;

    function initDragDrop() {
        const container = document.getElementById('busRowsContainer');
        container.addEventListener('mousedown',  onDragStart);
        container.addEventListener('touchstart', onDragStart, { passive: false });
        document.addEventListener('mousemove',   onDragMove);
        document.addEventListener('touchmove',   onDragMove,  { passive: false });
        document.addEventListener('mouseup',     onDragEnd);
        document.addEventListener('touchend',    onDragEnd);
        document.addEventListener('touchcancel', onDragEnd);
    }

    function getPointerY(e) {
        return e.touches && e.touches.length ? e.touches[0].clientY : e.clientY;
    }

    function onDragStart(e) {
        if (isFullscreenMode) return;
        const handle = e.target.closest('.drag-handle');
        if (!handle) return;
        const row = handle.closest('.bus-row');
        if (!row) return;
        e.preventDefault();

        const rect = row.getBoundingClientRect();
        const placeholder = document.createElement('div');
        placeholder.className = 'drag-placeholder';
        placeholder.style.height = rect.height + 'px';

        dragState = {
            row, placeholder,
            offsetY:   getPointerY(e) - rect.top,
            rowWidth:  rect.width,
            rowHeight: rect.height
        };

        row.classList.add('dragging');
        row.style.width  = rect.width  + 'px';
        row.style.height = rect.height + 'px';
        row.style.left   = rect.left   + 'px';
        row.style.top    = (getPointerY(e) - dragState.offsetY) + 'px';

        row.parentNode.insertBefore(placeholder, row);
        document.body.appendChild(row);
        document.body.classList.add('is-dragging');
        isDragging = true;
    }

    function onDragMove(e) {
        if (!isDragging || !dragState) return;
        e.preventDefault();
        const y = getPointerY(e);
        const { row, placeholder, offsetY } = dragState;

        row.style.top = (y - offsetY) + 'px';

        const container = document.getElementById('busRowsContainer');
        const siblings  = [...container.querySelectorAll('.bus-row,.drag-placeholder')];

        let targetIndex = siblings.length;
        for (let i = 0; i < siblings.length; i++) {
            const sib = siblings[i];
            if (sib === placeholder) continue;
            const box = sib.getBoundingClientRect();
            if (y < box.top + box.height / 2) { targetIndex = i; break; }
        }

        const curIdx = siblings.indexOf(placeholder);
        if (targetIndex !== curIdx) {
            placeholder.remove();
            const updated = [...container.querySelectorAll('.bus-row,.drag-placeholder')];
            if (targetIndex >= updated.length) container.appendChild(placeholder);
            else container.insertBefore(placeholder, updated[targetIndex]);
        }
    }

    function onDragEnd() {
        if (!isDragging || !dragState) return;
        const { row, placeholder } = dragState;
        const container = document.getElementById('busRowsContainer');

        row.classList.remove('dragging');
        row.style.position = ''; row.style.width  = '';
        row.style.height   = ''; row.style.left   = '';
        row.style.top      = ''; row.style.zIndex = '';

        container.insertBefore(row, placeholder);
        placeholder.remove();

        document.body.classList.remove('is-dragging');
        isDragging = false;
        dragState  = null;

        reorderStopsFromDOM();
    }

    function reorderStopsFromDOM() {
        const rows      = document.querySelectorAll('#busRowsContainer .bus-row');
        const keyToStop = new Map();
        currentStops.forEach(s => keyToStop.set(makeStopKey(s), s));

        const newOrder = [];
        rows.forEach(row => {
            const k = row.dataset.stopKey;
            if (keyToStop.has(k)) newOrder.push(keyToStop.get(k));
        });

        if (newOrder.length === currentStops.length) {
            currentStops = newOrder;
            saveStopsToStorage();
            // Rebuild renderedRows map in new order (elements are already in correct DOM order)
            renderedRows.clear();
            rows.forEach(row => {
                renderedRows.set(row.dataset.stopKey, {
                    element:      row,
                    etaSignature: row.querySelector('.eta-cell')?.innerHTML || ''
                });
            });
        }
    }

    // ─── Keyboard ────────────────────────────────────────────────────────────────
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
            closeStopSelector();
            if (isFullscreenMode) toggleFullscreenMode();
        }
    });

    // ─── Boot ────────────────────────────────────────────────────────────────────
    loadThemePreference();
    initDragDrop();

    const hadSaved = loadStopsFromStorage();
    if (hadSaved && currentStops.length > 0) {
        // Small delay so the page finishes painting first
        setTimeout(() => fetchMultiETA(), 300);
    }
    </script>
</body>
