<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>巴士到站時間預報</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            background-color: #f5f5f5;
            color: #222;
            font-family: 'Microsoft JhengHei', '微軟正黑體', 'Noto Sans TC', 'PingFang TC', sans-serif;
            min-height: 100vh;
            overflow-x: hidden
        }

        body.dark-mode {
            background-color: #0a0e27;
            color: #fff
        }

        body.fullscreen-mode {
            background-color: #fff;
            overflow: hidden
        }

        body.dark-mode.fullscreen-mode {
            background-color: #0d1117
        }

        body.dark-mode .header {
            background: linear-gradient(135deg, #141a3a, #0d1b3e 50%, #0b1636);
            box-shadow: 0 4px 20px rgba(0, 0, 0, .5)
        }

        body.dark-mode .header-title h1 {
            color: #fff
        }

        body.dark-mode .header-title .subtitle {
            color: rgba(255, 255, 255, .75)
        }

        body.dark-mode .header-time .current-time {
            color: #fff
        }

        body.dark-mode .header-time .current-date {
            color: rgba(255, 255, 255, .75)
        }

        body.dark-mode .controls {
            background: rgba(255, 255, 255, .05);
            border-bottom-color: rgba(255, 255, 255, .1)
        }

        body.dark-mode .status-bar {
            background: rgba(255, 255, 255, .03);
            color: rgba(255, 255, 255, .65);
            border-bottom-color: rgba(255, 255, 255, .05)
        }

        body.dark-mode .table-header {
            background: rgba(255, 255, 255, .06);
            color: rgba(255, 255, 255, .5);
            border-bottom-color: rgba(255, 255, 255, .12)
        }

        body.dark-mode .bus-row {
            background: rgba(255, 255, 255, .02) !important
        }

        body.dark-mode .bus-row:hover {
            background: rgba(255, 255, 255, .06) !important
        }

        body.dark-mode .stop-name {
            color: rgba(255, 255, 255, .6)
        }

        body.dark-mode .stop-name-en {
            color: rgba(255, 255, 255, .35)
        }

        body.dark-mode .dest-direction {
            color: #fff
        }

        body.dark-mode .eta-na {
            color: rgba(255, 255, 255, .3)
        }

        body.dark-mode .btn-toggle-fullscreen,
        body.dark-mode .btn-theme-toggle,
        body.dark-mode .btn-secondary {
            background: rgba(255, 255, 255, .08);
            color: rgba(255, 255, 255, .85);
            border-color: rgba(255, 255, 255, .18)
        }

        body.dark-mode .btn-toggle-fullscreen:hover,
        body.dark-mode .btn-theme-toggle:hover,
        body.dark-mode .btn-secondary:hover {
            background: rgba(255, 255, 255, .14)
        }

        body.dark-mode .modal {
            background: #0d1b3e;
            color: #fff
        }

        body.dark-mode .modal-header {
            background: rgba(255, 255, 255, .05);
            border-bottom-color: rgba(255, 255, 255, .12)
        }

        body.dark-mode .modal-header-title {
            color: #fff
        }

        body.dark-mode .modal-close-btn {
            color: rgba(255, 255, 255, .7)
        }

        body.dark-mode .modal-left {
            border-right-color: rgba(255, 255, 255, .12)
        }

        body.dark-mode .modal-label,
        body.dark-mode .modal-right-title,
        body.dark-mode .modal-footer {
            color: rgba(255, 255, 255, .65)
        }

        body.dark-mode .modal-footer {
            background: rgba(255, 255, 255, .05);
            border-top-color: rgba(255, 255, 255, .12)
        }

        body.dark-mode .modal-route-filter input,
        body.dark-mode #routeSelect {
            background: rgba(255, 255, 255, .06);
            color: #fff;
            border-color: rgba(255, 255, 255, .18)
        }

        body.dark-mode #routeSelect option {
            background: #0d1b3e;
            color: #fff
        }

        body.dark-mode .stop-list {
            border-color: rgba(255, 255, 255, .12);
            background: rgba(255, 255, 255, .03)
        }

        body.dark-mode .stop-list-item:hover {
            background: rgba(66, 165, 245, .18)
        }

        body.dark-mode .stop-list-item-main {
            color: #fff
        }

        body.dark-mode .stop-list-item-sub {
            color: rgba(255, 255, 255, .65)
        }

        body.dark-mode .direction-button {
            background: rgba(255, 255, 255, .06);
            color: rgba(255, 255, 255, .85);
            border-color: rgba(255, 255, 255, .18)
        }

        body.dark-mode .direction-button:hover {
            background: rgba(255, 255, 255, .12)
        }

        body.dark-mode .row-remove-btn {
            color: rgba(255, 255, 255, .4)
        }

        body.dark-mode .row-remove-btn:hover {
            color: #ef5350;
            background: rgba(239, 83, 80, .15)
        }

        body.dark-mode .eta-secondary {
            border-left-color: rgba(255, 255, 255, .15)
        }

        body.dark-mode .bus-row .row-accent {
            opacity: .85
        }

        body.dark-mode .stop-name-alt {
            color: rgba(255, 255, 255, .35);
            border-top-color: rgba(255, 255, 255, .1)
        }

        body.dark-mode .stop-name-alt .alt-badge {
            background: rgba(239, 83, 80, .18);
            color: #EF5350
        }

        body.fullscreen-mode .header,
        body.fullscreen-mode .controls,
        body.fullscreen-mode .status-bar,
        body.fullscreen-mode .footer,
        body.fullscreen-mode .table-header {
            display: none !important
        }

        body.fullscreen-mode .bus-rows-container {
            height: 100vh !important;
            max-height: 100vh !important;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            scrollbar-width: none;
            background: #fff
        }

        body.dark-mode.fullscreen-mode .bus-rows-container {
            background: #0d1117
        }

        body.fullscreen-mode .bus-rows-container::-webkit-scrollbar {
            display: none
        }

        body.fullscreen-mode .bus-row {
            height: 20vh !important;
            min-height: 20vh !important;
            max-height: 20vh !important;
            padding: 0 3vw 0 0 !important;
            grid-template-columns: 24vw 1fr 12vw 24vw !important;
            flex-shrink: 0;
            border-bottom: none !important;
            position: relative
        }

        body.fullscreen-mode .row-accent {
            width: 8px !important
        }

        body.fullscreen-mode .remove-cell {
            display: none !important
        }

        body.fullscreen-mode .drag-handle {
            display: none !important
        }

        body.fullscreen-mode .route-number {
            font-size: clamp(5rem, 14vh, 16vw) !important;
            letter-spacing: -3px !important
        }

        body.fullscreen-mode .dest-direction {
            font-size: clamp(2rem, 6.5vh, 7vw) !important;
            font-weight: 700 !important;
            line-height: 1.05 !important
        }

        body.fullscreen-mode .stop-name {
            font-size: clamp(.9rem, 2.2vh, 2.5vw) !important;
            margin-top: 6px !important
        }

        body.fullscreen-mode .stop-name-en {
            font-size: clamp(.7rem, 1.6vh, 1.8vw) !important
        }

        body.fullscreen-mode .company-logo {
            max-height: clamp(2.5rem, 7vh, 6vw) !important;
            max-width: clamp(6rem, 14vw, 180px) !important
        }

        body.fullscreen-mode .company-tag {
            font-size: clamp(1rem, 2.5vh, 2.5vw) !important;
            padding: 8px 18px !important
        }

        body.fullscreen-mode .eta-primary .eta-min {
            font-size: clamp(4rem, 13vh, 15vw) !important
        }

        body.fullscreen-mode .eta-primary .eta-unit {
            font-size: clamp(1rem, 2.5vh, 2.5vw) !important
        }

        body.fullscreen-mode .eta-secondary .eta-min {
            font-size: clamp(1.5rem, 4vh, 4.5vw) !important
        }

        body.fullscreen-mode .eta-secondary .eta-unit {
            font-size: clamp(.75rem, 1.8vh, 2vw) !important
        }

        body.fullscreen-mode .eta-secondary {
            gap: 8px !important
        }

        body.fullscreen-mode .eta-cell {
            gap: clamp(12px, 2.5vw, 36px) !important
        }

        body.fullscreen-mode .eta-secondary {
            padding-left: clamp(12px, 2vw, 28px) !important;
            border-left-width: 3px !important
        }

        body.fullscreen-mode .stop-cell {
            padding: 0 clamp(12px, 2.5vw, 40px) !important;
            gap: 4px !important
        }

        body.fullscreen-mode .route-cell {
            padding-left: 16px !important
        }

        body.fullscreen-mode .bus-row::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 20px;
            right: 20px;
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, rgba(0, 0, 0, .08) 10%, rgba(0, 0, 0, .08) 90%, transparent 100%)
        }

        body.dark-mode.fullscreen-mode .bus-row::after {
            background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, .08) 10%, rgba(255, 255, 255, .08) 90%, transparent 100%)
        }

        /* ── Drag handle ── */
        .drag-handle {
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            color: #ccc;
            font-size: 18px;
            user-select: none;
            touch-action: none;
            transition: color .2s;
            padding: 0 4px
        }

        .drag-handle:hover {
            color: #777
        }

        .drag-handle:active {
            cursor: grabbing;
            color: #444
        }

        body.dark-mode .drag-handle {
            color: rgba(255, 255, 255, .15)
        }

        body.dark-mode .drag-handle:hover {
            color: rgba(255, 255, 255, .45)
        }

        /* Dragged row — floats with cursor */
        .bus-row.dragging {
            position: fixed !important;
            z-index: 1000 !important;
            pointer-events: none !important;
            box-shadow: 0 16px 48px rgba(0, 0, 0, .2), 0 4px 12px rgba(0, 0, 0, .1) !important;
            opacity: .92 !important;
            border-radius: 8px !important;
            border: 2px solid #1976d2 !important;
            transition: box-shadow .2s !important;
            will-change: top;
        }

        body.dark-mode .bus-row.dragging {
            box-shadow: 0 16px 48px rgba(0, 0, 0, .5), 0 4px 12px rgba(0, 0, 0, .3) !important;
            border-color: #42a5f5 !important;
            background: #151c34 !important
        }

        /* Placeholder gap */
        .drag-placeholder {
            border: 2px dashed #90caf9;
            border-radius: 6px;
            background: rgba(25, 118, 210, .06);
            transition: height .15s ease
        }

        body.dark-mode .drag-placeholder {
            background: rgba(66, 165, 245, .06);
            border-color: rgba(66, 165, 245, .3)
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .45);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200
        }

        .modal-backdrop.active {
            display: flex
        }

        .modal {
            background: #fff;
            border-radius: 12px;
            max-width: 960px;
            width: 94%;
            max-height: 82vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 16px 40px rgba(0, 0, 0, .3);
            overflow: hidden
        }

        .modal-header {
            padding: 14px 20px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fafafa;
            flex-shrink: 0
        }

        .modal-header-title {
            font-size: 18px;
            font-weight: 600;
            color: #333
        }

        .modal-close-btn {
            border: none;
            background: transparent;
            font-size: 22px;
            cursor: pointer;
            color: #757575;
            padding: 4px 8px
        }

        .modal-body {
            display: grid;
            grid-template-columns: 1.1fr 1.3fr;
            padding: 16px 20px;
            column-gap: 16px;
            overflow-y: auto;
            flex: 1
        }

        .modal-left,
        .modal-right {
            display: flex;
            flex-direction: column;
            gap: 10px
        }

        .modal-left {
            border-right: 1px solid #eee;
            padding-right: 12px
        }

        .modal-right {
            padding-left: 4px
        }

        .modal-label {
            font-size: 14px;
            color: #616161;
            margin-bottom: 2px
        }

        .modal-route-filter {
            display: flex;
            flex-direction: column;
            gap: 6px
        }

        .modal-route-filter input {
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #cfcfcf;
            font-size: 14px;
            font-family: inherit
        }

        .modal-route-filter input:focus {
            outline: none;
            border-color: #42a5f5;
            box-shadow: 0 0 0 2px rgba(66, 165, 245, .25)
        }

        #routeSelect {
            width: 100%;
            border-radius: 6px;
            border: 1px solid #cfcfcf;
            padding: 4px;
            font-size: 14px;
            min-height: 200px;
            font-family: inherit
        }

        .direction-buttons {
            display: flex;
            gap: 8px
        }

        .direction-button {
            flex: 1;
            padding: 6px 8px;
            font-size: 13px;
            border-radius: 999px;
            border: 1px solid #bdbdbd;
            background: #fafafa;
            cursor: pointer;
            color: #424242;
            transition: all .2s;
            font-family: inherit
        }

        .direction-button.active {
            background: #1976d2;
            color: #fff;
            border-color: #1976d2
        }

        .direction-button:hover {
            background: #e0e0e0
        }

        .modal-load-stops-btn {
            padding: 7px 14px;
            border-radius: 6px;
            border: none;
            background: #1976d2;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            font-family: inherit
        }

        .modal-load-stops-btn:disabled {
            opacity: .5;
            cursor: default
        }

        .modal-right-title {
            font-size: 14px;
            color: #616161
        }

        .stop-list {
            border-radius: 6px;
            border: 1px solid #e0e0e0;
            padding: 4px;
            flex: 1;
            overflow-y: auto;
            min-height: 200px;
            max-height: 380px
        }

        .stop-list-item {
            padding: 7px 8px;
            border-radius: 4px;
            cursor: pointer;
            transition: background .15s
        }

        .stop-list-item:hover {
            background: #e3f2fd
        }

        .stop-list-item-main {
            font-size: 14px;
            color: #212121
        }

        .stop-list-item-sub {
            font-size: 12px;
            color: #757575;
            margin-top: 1px
        }

        .stop-list-empty {
            font-size: 13px;
            color: #9e9e9e;
            padding: 12px 8px
        }

        .modal-footer {
            padding: 8px 20px 10px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: #9e9e9e;
            background: #fafafa;
            flex-shrink: 0
        }

        .company-selector {
            display: flex;
            gap: 6px;
            flex-wrap: wrap
        }

        .company-btn {
            padding: 5px 14px;
            font-size: 13px;
            border-radius: 999px;
            border: 1px solid #bdbdbd;
            background: #fafafa;
            cursor: pointer;
            color: #424242;
            transition: all .2s;
            font-weight: 600;
            font-family: inherit
        }

        .company-btn.active {
            background: #1976d2;
            color: #fff;
            border-color: #1976d2
        }

        .company-btn:hover:not(.active) {
            background: #e0e0e0
        }

        body.dark-mode .company-btn {
            background: rgba(255, 255, 255, .06);
            color: rgba(255, 255, 255, .85);
            border-color: rgba(255, 255, 255, .18)
        }

        body.dark-mode .company-btn:hover:not(.active) {
            background: rgba(255, 255, 255, .12)
        }

        .header {
            background: linear-gradient(135deg, #fff, #f3f3f3 40%, #e0e0e0);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, .08);
            position: sticky;
            top: 0;
            z-index: 100
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 20px
        }

        .header-title .icon {
            font-size: 48px
        }

        .header-title h1 {
            font-size: 38px;
            font-weight: 700;
            letter-spacing: 4px;
            color: #333
        }

        .header-title .subtitle {
            font-size: 15px;
            color: #616161;
            margin-top: 4px
        }

        .header-time {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px
        }

        .header-time .current-time {
            font-size: 48px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: #212121
        }

        .header-time .current-date {
            font-size: 17px;
            color: #757575
        }

        .btn-toggle-fullscreen,
        .btn-theme-toggle {
            padding: 6px 16px;
            font-size: 14px;
            border-radius: 999px;
            border: 1px solid #bdbdbd;
            background: #fff;
            color: #424242;
            cursor: pointer;
            transition: all .2s;
            font-family: inherit
        }

        .btn-toggle-fullscreen:hover,
        .btn-theme-toggle:hover {
            background: #e0e0e0
        }

        .btn-secondary {
            background: #e3f2fd;
            color: #424242;
            border: 1px solid #bdbdbd;
            padding: 8px 18px;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all .2s;
            font-family: inherit
        }

        .btn-secondary:hover {
            background: #bbdefb
        }

        .controls {
            background: #fff;
            padding: 14px 40px;
            display: flex;
            gap: 14px;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 1px solid #e0e0e0
        }

        .controls button {
            padding: 10px 28px;
            font-size: 17px;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            transition: all .3s;
            letter-spacing: 1px
        }

        .btn-search {
            background: linear-gradient(135deg, #1976d2, #42a5f5);
            color: #fff
        }

        .btn-search:hover {
            background: linear-gradient(135deg, #1565c0, #2196f3);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(25, 118, 210, .4)
        }

        .status-bar {
            background: #fafafa;
            padding: 9px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: #757575;
            border-bottom: 1px solid #e0e0e0
        }

        .status-bar .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4caf50;
            animation: pulse 2s infinite
        }

        .status-dot.error {
            background: #f44336;
            animation: none
        }

        .status-dot.loading {
            background: #ff9800;
            animation: pulse .5s infinite
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: .4
            }
        }

        .table-header {
            display: grid;
            grid-template-columns: 32px 1fr 2fr 1fr 1.8fr 60px;
            padding: 12px 32px;
            background: #f0f0f0;
            font-size: 13px;
            font-weight: 700;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 3px;
            border-bottom: 2px solid #ddd;
            position: sticky;
            top: 100px;
            z-index: 50
        }

        .table-header>div {
            display: flex;
            align-items: center;
            justify-content: center
        }

        .table-header>div:nth-child(3) {
            justify-content: flex-start;
            padding-left: 20px
        }

        .bus-rows-container {
            max-height: calc(100vh - 280px);
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #bdbdbd transparent;
            position: relative
        }

        .bus-rows-container::-webkit-scrollbar {
            width: 6px
        }

        .bus-rows-container::-webkit-scrollbar-thumb {
            background: #bdbdbd;
            border-radius: 3px
        }

        body.dark-mode .bus-rows-container {
            scrollbar-color: #1565c0 transparent
        }

        body.dark-mode .bus-rows-container::-webkit-scrollbar-thumb {
            background: #1565c0
        }

        .bus-row {
            display: grid;
            grid-template-columns: 32px 1fr 2fr 1fr 1.8fr 60px;
            padding: 16px 32px;
            background: #fff;
            align-items: center;
            border-bottom: 1px solid rgba(0, 0, 0, .06);
            position: relative
        }

        body.dark-mode .bus-row {
            border-bottom-color: rgba(255, 255, 255, .06)
        }

        .bus-row.row-enter {
            animation: fadeInRow .4s ease forwards;
            opacity: 0
        }

        @keyframes fadeInRow {
            from {
                opacity: 0;
                transform: translateY(8px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .bus-row:hover {
            background: #f8fafc
        }

        body.dark-mode .bus-row:hover {
            background: rgba(255, 255, 255, .05) !important
        }

        .row-accent {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 5px;
            border-radius: 0 3px 3px 0
        }

        .row-accent.accent-ctb {
            background: linear-gradient(180deg, #FFE680, #FFDA44)
        }

        .row-accent.accent-kmb {
            background: linear-gradient(180deg, #EF5350, #C62828)
        }

        .row-accent.accent-lwb {
            background: linear-gradient(180deg, #FFA726, #E65100)
        }

        .row-accent.accent-nlb {
            background: linear-gradient(180deg, #66BB6A, #2E7D32)
        }

        .row-accent.accent-mtr {
            background: linear-gradient(180deg, #78909C, #455A64)
        }

        .row-accent.accent-night {

    <script>
        const JOINT_ROUTES = new Set(['101', '102', '104', '105', '106', '107', '108', '109', '110', '111', '112', '113', '115', '116', '118', 'N121', '170', '171', '182', '182P', 'N182', '307', '307P', 'N307', '619', '680', '681', '682', '690']);
        const COMPANY_LOGOS = { CTB: 'https://www.citybus.com.hk/_common/images/logo.png', KMB: 'https://upload.wikimedia.org/wikipedia/en/thumb/b/b4/KowloonMotorBus.svg/3840px-KowloonMotorBus.svg.png', LWB: 'https://upload.wikimedia.org/wikipedia/en/thumb/f/f1/Long_Win_Bus_logo.svg/500px-Long_Win_Bus_logo.svg.png', NLB: 'https://www.td.gov.hk/filemanager/en/content_391/nlb_logo-color-v.png', MTR: 'https://upload.wikimedia.org/wikipedia/en/thumb/b/b9/HK_MTR_logo.svg/960px-HK_MTR_logo.svg.png', NWFB: 'https://www.citybus.com.hk/_common/images/logo.png' };
        const logoLoadCache = {}; function testLogoUrl(url) { if (url in logoLoadCache) return Promise.resolve(logoLoadCache[url]); return new Promise(r => { const i = new Image(); i.onload = () => { logoLoadCache[url] = true; r(true) }; i.onerror = () => { logoLoadCache[url] = false; r(false) }; i.src = url }); } Object.values(COMPANY_LOGOS).forEach(u => testLogoUrl(u));
        const LWB_ROUTE_PREFIXES = ['A', 'B', 'E', 'R', 'S']; function isLwbRoute(r) { r = r.toUpperCase(); return LWB_ROUTE_PREFIXES.some(p => r.startsWith(p) && /^[A-Z]\d/.test(r)); }
        const API = { CTB: { routeList: 'https://rt.data.gov.hk/v2/transport/citybus/route/CTB', routeStop: (route, dir) => `https://rt.data.gov.hk/v2/transport/citybus/route-stop/CTB/${route}/${dir}`, stop: id => `https://rt.data.gov.hk/v2/transport/citybus/stop/${id}`, eta: (s, r) => `https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/${s}/${r}` }, KMB: { routeList: 'https://data.etabus.gov.hk/v1/transport/kmb/route/', routeStop: (r, d, st) => `https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${r}/${d}/${st || 1}`, stop: id => `https://data.etabus.gov.hk/v1/transport/kmb/stop/${id}`, eta: (s, r, st) => `https://data.etabus.gov.hk/v1/transport/kmb/eta/${s}/${r}/${st || 1}` }, NLB: { routeList: 'https://rt.data.gov.hk/v1/transport/nlb/route.php?action=list', routeStop: rid => `https://rt.data.gov.hk/v2/transport/nlb/stop.php?action=list&routeId=${rid}`, eta: (s, rid) => `https://rt.data.gov.hk/v2/transport/nlb/stop.php?action=estimatedArrivals&routeId=${rid}&stopId=${s}&language=zh` } };
        const REFRESH_INTERVAL = 15000, STORAGE_KEY = 'busEtaStops_v2';
        let refreshTimer = null, stopNameCache = {}, routeListCache = {}, currentStops = [], explicitTheme = null, selectedDirection = null, selectedCompany = 'CTB', isFullscreenMode = false, renderedRows = new Map(), isFirstRender = true;

        function makeStopKey(sd) { const dir = sd.company === 'NLB' ? 'nlb' : (sd.direction || 'none'); const rid = sd.company === 'NLB' ? (sd.nlbRouteId || sd.routeId) : sd.routeId; return `${sd.company}||${rid}||${sd.stopId}||${dir}`; }
        function saveStopsToStorage() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(currentStops.map(s => ({ stopId: s.stopId, routeId: s.routeId, nlbRouteId: s.nlbRouteId, direction: s.direction, company: s.company, serviceType: s.serviceType, nlbDest: s.nlbDest || '', stopInfoCache: s.stopInfo, altStopName: s.altStopName || null })))); } catch (e) { } }

        function updateClock() { const now = new Date(); document.getElementById('currentTime').textContent = now.toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }); const d = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六']; document.getElementById('currentDate').textContent = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 ${d[now.getDay()]}`; } setInterval(updateClock, 1000); updateClock();
        function applyTheme(t) { document.body.classList.toggle('dark-mode', t === 'dark'); const b = document.getElementById('themeToggleBtn'); if (b) b.textContent = t === 'dark' ? '淺色模式' : '深色模式'; }

aset.destTc || opt.dataset.origTc || route; if (!nid) { list.innerHTML = '<div class="stop-list-empty">無法取得路線ID。</div>'; return; } const r = await fetch(API.NLB.routeStop(nid)); if (!r.ok) { list.innerHTML = `<div class="stop-list-empty">載入失敗</div>`; return; } const d = await r.json(); const stops = d.stops || []; if (!stops.length) { list.innerHTML = '<div class="stop-list-empty">沒有巴士站資料。</div>'; return; } list.innerHTML = ''; for (const s of stops) { const ntc = s.stopName_zh || s.stopName_c || s.stopId || ''; const nen = s.stopName_en || s.stopName_e || ''; const sid = s.stopId || s.stop || ''; const info = { name_tc: ntc, name_en: nen }; stopNameCache[`NLB_${sid}`] = info; appendStopItem(list, sid, route, info, 'NLB', null, nid, nd); } } if (title) title.textContent = selectedCompany === 'NLB' ? `已選路線：${route}（${opt.dataset.origTc || ''}）` : `已選路線：${route}（${opt.dataset.origTc || ''} ↔ ${opt.dataset.destTc || ''}）`; } catch (e) { list.innerHTML = '<div class="stop-list-empty">載入錯誤。</div>'; } finally { if (btn) btn.disabled = false; } }
        function appendStopItem(c, sid, route, info, company, st, nrid, nd) { const item = document.createElement('div'); item.className = 'stop-list-item'; item.onclick = () => selectStopFromModal(sid, route, info, company, st, nrid, nd); item.innerHTML = `<div class="stop-list-item-main">${info.name_tc || sid}</div><div class="stop-list-item-sub">${info.name_en || ''} （站號：${sid}）</div>`; c.appendChild(item); }
        async function selectStopFromModal(sid, rno, si, co, st, nrid, nd) { const dir = co === 'NLB' ? null : selectedDirection; const sd = { stopId: sid, routeId: rno, nlbRouteId: nrid || null, direction: dir, company: co || selectedCompany, serviceType: st || 1, nlbDest: nd || '', stopInfo: si || await fetchStopName(sid, co), altStopName: null }; const key = makeStopKey(sd); const idx = currentStops.findIndex(s => makeStopKey(s) === key); if (idx >= 0) currentStops.splice(idx, 1); else currentStops.push(sd); saveStopsToStorage(); closeStopSelector(); updateClearButton(); isFirstRender = true; renderedRows.clear(); if (currentStops.length > 0) fetchMultiETA(); }

        // ════════════════════════════════════════════
        //  Custom pointer-based Drag & Drop
        //  Row sticks to cursor, others shift in real time
        // ════════════════════════════════════════════
        let isDragging = false, dragState = null;

        function initDragDrop() {
            const container = document.getElementById('busRowsContainer');
            container.addEventListener('mousedown', onDragStart);
            container.addEventListener('touchstart', onDragStart, { passive: false });
            document.addEventListener('mousemove', onDragMove);
            document.addEventListener('touchmove', onDragMove, { passive: false });
            document.addEventListener('mouseup', onDragEnd);
            document.addEventListener('touchend', onDragEnd);
            document.addEventListener('touchcancel', onDragEnd);
        }

        function getPointerY(e) { return e.touches && e.touches.length ? e.touches[0].clientY : e.clientY; }

        function onDragStart(e) {
            if (isFullscreenMode) return;
            const handle = e.target.closest('.drag-handle');
            if (!handle) return;
            const row = handle.closest('.bus-row');
            if (!row) return;
            e.preventDefault();

            const container = document.getElementById('busRowsContainer');
            const rect = row.getBoundingClientRect();

            // Create placeholder
            const placeholder = document.createElement('div');
            placeholder.className = 'drag-placeholder';
            placeholder.style.height = rect.height + 'px';

            dragState = {
                row, placeholder,
                offsetY: getPointerY(e) - rect.top,
                rowWidth: rect.width,
                rowHeight: rect.height,
            };

            // Lift the row
            row.classList.add('dragging');
            row.style.width = rect.width + 'px';
            row.style.height = rect.height + 'px';
            row.style.left = rect.left + 'px';
            row.style.top = (getPointerY(e) - dragState.offsetY) + 'px';

            // Insert placeholder where row was
            row.parentNode.insertBefore(placeholder, row);

            // Move row to body so it floats above everything
            document.body.appendChild(row);
            document.body.classList.add('is-dragging');
            isDragging = true;
        }

        function onDragMove(e) {
            if (!isDragging || !dragState) return;
            e.preventDefault();
            const y = getPointerY(e);
            const { row, placeholder, offsetY } = dragState;

            // Move row with cursor
            row.style.top = (y - offsetY) + 'px';

            // Find correct position in container
            const container = document.getElementById('busRowsContainer');
            const siblings = [...container.querySelectorAll('.bus-row,.drag-placeholder')];

            let targetIndex = siblings.length;
            for (let i = 0; i < siblings.length; i++) {
                const sib = siblings[i];
                if (sib === placeholder) continue;
                const box = sib.getBoundingClientRect();
                if (y < box.top + box.height / 2) { targetIndex = i; break; }
            }

            // Move placeholder to new position
            const curIdx = siblings.indexOf(placeholder);
            if (targetIndex !== curIdx) {
                placeholder.remove();
                const updated = [...container.querySelectorAll('.bus-row,.drag-placeholder')];
                if (targetIndex >= updated.length) container.appendChild(placeholder);
                else container.insertBefore(placeholder, updated[targetIndex]);
            }
        }

        function onDragEnd() {
            if (!isDragging || !dragState) return;
            const { row, placeholder } = dragState;
            const container = document.getElementById('busRowsContainer');

            // Remove floating styles
            row.classList.remove('dragging');
            row.style.position = ''; row.style.width = ''; row.style.height = '';
            row.style.left = ''; row.style.top = ''; row.style.zIndex = '';

            // Put row back where placeholder is
            container.insertBefore(row, placeholder);
            placeholder.remove();

            document.body.classList.remove('is-dragging');
            isDragging = false; dragState = null;

            // Sync new order to data
            reorderStopsFromDOM();
        }

        function reorderStopsFromDOM() {
            const rows = document.querySelectorAll('#busRowsContainer .bus-row');
            const keyToStop = new Map();
            currentStops.forEach(s => keyToStop.set(makeStopKey(s), s));
            const newOrder = [];
            rows.forEach(row => { const k = row.dataset.stopKey; if (keyToStop.has(k)) newOrder.push(keyToStop.get(k)); });
            if (newOrder.length === currentStops.length) {
                currentStops = newOrder;
                saveStopsToStorage();
                renderedRows.clear();
                rows.forEach(row => { renderedRows.set(row.dataset.stopKey, { element: row, etaSignature: row.querySelector('.eta-cell')?.innerHTML || '' }); });
            }
        }

        document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeStopSelector(); if (isFullscreenMode) toggleFullscreenMode(); } });
        loadThemePreference(); initDragDrop();
        const hadSaved = loadStopsFromStorage();
        if (hadSaved && currentStops.length > 0) setTimeout(() => fetchMultiETA(), 500);
    </script>
