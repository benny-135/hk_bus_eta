<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>巴士到站時間預報</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f5f5f5;
            color: #222;
            font-family: 'Microsoft JhengHei', '微軟正黑體', 'Noto Sans TC', 'PingFang TC', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body.dark-mode {
            background-color: #0a0e27;
            color: #fff;
        }

        body.fullscreen-mode {
            background-color: #fff;
            overflow: hidden;
        }

        body.dark-mode.fullscreen-mode {
            background-color: #0d1117;
        }

        body.dark-mode .header {
            background: linear-gradient(135deg, #141a3a, #0d1b3e 50%, #0b1636);
            box-shadow: 0 4px 20px rgba(0, 0, 0, .5);
        }

        body.dark-mode .header-title h1 {
            color: #fff;
        }

        body.dark-mode .header-title .subtitle {
            color: rgba(255, 255, 255, .75);
        }

        body.dark-mode .header-time .current-time {
            color: #fff;
        }

        body.dark-mode .header-time .current-date {
            color: rgba(255, 255, 255, .75);
        }

        body.dark-mode .controls {
            background: rgba(255, 255, 255, .05);
            border-bottom-color: rgba(255, 255, 255, .1);
        }

        body.dark-mode .status-bar {
            background: rgba(255, 255, 255, .03);
            color: rgba(255, 255, 255, .65);
            border-bottom-color: rgba(255, 255, 255, .05);
        }

        body.dark-mode .table-header {
            background: rgba(255, 255, 255, .06);
            color: rgba(255, 255, 255, .5);
            border-bottom-color: rgba(255, 255, 255, .12);
        }

        body.dark-mode .bus-row {
            background: rgba(255, 255, 255, .02) !important;
        }

        body.dark-mode .bus-row:hover {
            background: rgba(255, 255, 255, .06) !important;
        }

        body.dark-mode .stop-name {
            color: rgba(255, 255, 255, .6);
        }

        body.dark-mode .stop-name-en {
            color: rgba(255, 255, 255, .35);
        }

        body.dark-mode .dest-direction {
            color: #ffffff;
        }

        body.dark-mode .eta-na {
            color: rgba(255, 255, 255, .3);
        }

        body.dark-mode .btn-toggle-fullscreen,
        body.dark-mode .btn-theme-toggle,
        body.dark-mode .btn-secondary {
            background: rgba(255, 255, 255, .08);
            color: rgba(255, 255, 255, .85);
            border-color: rgba(255, 255, 255, .18);
        }

        body.dark-mode .btn-toggle-fullscreen:hover,
        body.dark-mode .btn-theme-toggle:hover,
        body.dark-mode .btn-secondary:hover {
            background: rgba(255, 255, 255, .14);
        }

        body.dark-mode .modal {
            background: #0d1b3e;
            color: #fff;
        }

        body.dark-mode .modal-header {
            background: rgba(255, 255, 255, .05);
            border-bottom-color: rgba(255, 255, 255, .12);
        }

        body.dark-mode .modal-header-title {
            color: #fff;
        }

        body.dark-mode .modal-close-btn {
            color: rgba(255, 255, 255, .7);
        }

        body.dark-mode .modal-left {
            border-right-color: rgba(255, 255, 255, .12);
        }

        body.dark-mode .modal-label,
        body.dark-mode .modal-right-title,
        body.dark-mode .modal-footer {
            color: rgba(255, 255, 255, .65);
        }

        body.dark-mode .modal-footer {
            background: rgba(255, 255, 255, .05);
            border-top-color: rgba(255, 255, 255, .12);
        }

        body.dark-mode .modal-route-filter input,
        body.dark-mode #routeSelect {
            background: rgba(255, 255, 255, .06);
            color: #fff;
            border-color: rgba(255, 255, 255, .18);
        }

        body.dark-mode #routeSelect option {
            background: #0d1b3e;
            color: #fff;
        }

        body.dark-mode .stop-list {
            border-color: rgba(255, 255, 255, .12);
            background: rgba(255, 255, 255, .03);
        }

        body.dark-mode .stop-list-item:hover {
            background: rgba(66, 165, 245, .18);
        }

        body.dark-mode .stop-list-item-main {
            color: #fff;
        }

        body.dark-mode .stop-list-item-sub {
            color: rgba(255, 255, 255, .65);
        }

        body.dark-mode .direction-button {
            background: rgba(255, 255, 255, .06);
            color: rgba(255, 255, 255, .85);
            border-color: rgba(255, 255, 255, .18);
        }

        body.dark-mode .direction-button:hover {
            background: rgba(255, 255, 255, .12);
        }

        body.dark-mode .row-remove-btn {
            color: rgba(255, 255, 255, .4);
        }

        body.dark-mode .row-remove-btn:hover {
            color: #ef5350;
            background: rgba(239, 83, 80, .15);
        }

        body.dark-mode .eta-secondary {
            border-left-color: rgba(255, 255, 255, .15);
        }

        body.dark-mode .bus-row .row-accent {
            opacity: 0.85;
        }

        body.fullscreen-mode .header,
        body.fullscreen-mode .controls,
        body.fullscreen-mode .status-bar,
        body.fullscreen-mode .footer,
        body.fullscreen-mode .table-header {
            display: none !important;
        }

        body.fullscreen-mode .bus-rows-container {
            height: 100vh !important;
            max-height: 100vh !important;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            scrollbar-width: none;
            background: #fff;
        }

        body.dark-mode.fullscreen-mode .bus-rows-container {
            background: #0d1117;
        }

        body.fullscreen-mode .bus-rows-container::-webkit-scrollbar {
            display: none;
        }

        body.fullscreen-mode .bus-row {
            height: 20vh !important;
            min-height: 20vh !important;
            max-height: 20vh !important;
            padding: 0 3vw 0 0 !important;
            grid-template-columns: 24vw 1fr 12vw 24vw !important;
            flex-shrink: 0;
            border-bottom: none !important;
            position: relative;
        }

        body.fullscreen-mode .row-accent {
            width: 8px !important;
        }

        body.fullscreen-mode .remove-cell {
            display: none !important;
        }

        body.fullscreen-mode .route-number {
            font-size: clamp(5rem, 14vh, 16vw) !important;
            letter-spacing: -3px !important;
        }

        body.fullscreen-mode .dest-direction {
            font-size: clamp(2rem, 6.5vh, 7vw) !important;
            font-weight: 700 !important;
            line-height: 1.05 !important;
        }

        body.fullscreen-mode .stop-name {
            font-size: clamp(0.9rem, 2.2vh, 2.5vw) !important;
            margin-top: 6px !important;
        }

        body.fullscreen-mode .stop-name-en {
            font-size: clamp(0.7rem, 1.6vh, 1.8vw) !important;
        }

        body.fullscreen-mode .company-logo {
            max-height: clamp(2.5rem, 7vh, 6vw) !important;
            max-width: clamp(6rem, 14vw, 180px) !important;
        }

        body.fullscreen-mode .company-tag {
            font-size: clamp(1rem, 2.5vh, 2.5vw) !important;
            padding: 8px 18px !important;
        }

        body.fullscreen-mode .eta-primary .eta-min {
            font-size: clamp(4rem, 13vh, 15vw) !important;
        }

        body.fullscreen-mode .eta-primary .eta-unit {
            font-size: clamp(1rem, 2.5vh, 2.5vw) !important;
        }

        body.fullscreen-mode .eta-secondary .eta-min {
            font-size: clamp(1.5rem, 4vh, 4.5vw) !important;
        }

        body.fullscreen-mode .eta-secondary .eta-unit {
            font-size: clamp(0.75rem, 1.8vh, 2vw) !important;
        }

        body.fullscreen-mode .eta-secondary {
            gap: 8px !important;
        }

        body.fullscreen-mode .eta-cell {
            gap: clamp(12px, 2.5vw, 36px) !important;
        }

        body.fullscreen-mode .eta-secondary {
            padding-left: clamp(12px, 2vw, 28px) !important;
            border-left-width: 3px !important;
        }

        body.fullscreen-mode .stop-cell {
            padding: 0 clamp(12px, 2.5vw, 40px) !important;
            gap: 4px !important;
        }

        body.fullscreen-mode .route-cell {
            padding-left: 16px !important;
        }

        body.fullscreen-mode .bus-row::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 20px;
            right: 20px;
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, rgba(0, 0, 0, .08) 10%, rgba(0, 0, 0, .08) 90%, transparent 100%);
        }

        body.dark-mode.fullscreen-mode .bus-row::after {
            background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, .08) 10%, rgba(255, 255, 255, .08) 90%, transparent 100%);
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .45);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }

        .modal-backdrop.active {
            display: flex;
        }

        .modal {
            background: #fff;
            border-radius: 12px;
            max-width: 960px;
            width: 94%;
            max-height: 82vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 16px 40px rgba(0, 0, 0, .3);
            overflow: hidden;
        }

        .modal-header {
            padding: 14px 20px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fafafa;
            flex-shrink: 0;
        }

        .modal-header-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .modal-close-btn {
            border: none;
            background: transparent;
            font-size: 22px;
            cursor: pointer;
            color: #757575;
            padding: 4px 8px;
        }

        .modal-body {
            display: grid;
            grid-template-columns: 1.1fr 1.3fr;
            padding: 16px 20px;
            column-gap: 16px;
            overflow-y: auto;
            flex: 1;
        }

        .modal-left,
        .modal-right {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .modal-left {
            border-right: 1px solid #eee;
            padding-right: 12px;
        }

        .modal-right {
            padding-left: 4px;
        }

        .modal-label {
            font-size: 14px;
            color: #616161;
            margin-bottom: 2px;
        }

        .modal-route-filter {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .modal-route-filter input {
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #cfcfcf;
            font-size: 14px;
            font-family: inherit;
        }

        .modal-route-filter input:focus {
            outline: none;
            border-color: #42a5f5;
            box-shadow: 0 0 0 2px rgba(66, 165, 245, .25);
        }

        #routeSelect {
            width: 100%;
            border-radius: 6px;
            border: 1px solid #cfcfcf;
            padding: 4px;
            font-size: 14px;
            min-height: 200px;
            font-family: inherit;
        }

        .direction-buttons {
            display: flex;
            gap: 8px;
        }

        .direction-button {
            flex: 1;
            padding: 6px 8px;
            font-size: 13px;
            border-radius: 999px;
            border: 1px solid #bdbdbd;
            background: #fafafa;
            cursor: pointer;
            color: #424242;
            transition: all .2s;
            font-family: inherit;
        }

        .direction-button.active {
            background: #1976d2;
            color: #fff;
            border-color: #1976d2;
        }

        .direction-button:hover {
            background: #e0e0e0;
        }

        .modal-load-stops-btn {
            padding: 7px 14px;
            border-radius: 6px;
            border: none;
            background: #1976d2;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            font-family: inherit;
        }

        .modal-load-stops-btn:disabled {
            opacity: .5;
            cursor: default;
        }

        .modal-right-title {
            font-size: 14px;
            color: #616161;
        }

        .stop-list {
            border-radius: 6px;
            border: 1px solid #e0e0e0;
            padding: 4px;
            flex: 1;
            overflow-y: auto;
            min-height: 200px;
            max-height: 380px;
        }

        .stop-list-item {
            padding: 7px 8px;
            border-radius: 4px;
            cursor: pointer;
            transition: background .15s;
        }

        .stop-list-item:hover {
            background: #e3f2fd;
        }

        .stop-list-item-main {
            font-size: 14px;
            color: #212121;
        }

        .stop-list-item-sub {
            font-size: 12px;
            color: #757575;
            margin-top: 1px;
        }

        .stop-list-empty {
            font-size: 13px;
            color: #9e9e9e;
            padding: 12px 8px;
        }

        .modal-footer {
            padding: 8px 20px 10px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: #9e9e9e;
            background: #fafafa;
            flex-shrink: 0;
        }

        .company-selector {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .company-btn {
            padding: 5px 14px;
            font-size: 13px;
            border-radius: 999px;
            border: 1px solid #bdbdbd;
            background: #fafafa;
            cursor: pointer;
            color: #424242;
            transition: all .2s;
            font-weight: 600;
            font-family: inherit;
        }

        .company-btn.active {
            background: #1976d2;
            color: #fff;
            border-color: #1976d2;
        }

        .company-btn:hover:not(.active) {
            background: #e0e0e0;
        }

        body.dark-mode .company-btn {
            background: rgba(255, 255, 255, .06);
            color: rgba(255, 255, 255, .85);
            border-color: rgba(255, 255, 255, .18);
        }

        body.dark-mode .company-btn:hover:not(.active) {
            background: rgba(255, 255, 255, .12);
        }

        .header {
            background: linear-gradient(135deg, #fff, #f3f3f3 40%, #e0e0e0);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, .08);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header-title .icon {
            font-size: 48px;
        }

        .header-title h1 {
            font-size: 38px;
            font-weight: 700;
            letter-spacing: 4px;
            color: #333;
        }

        .header-title .subtitle {
            font-size: 15px;
            color: #616161;
            margin-top: 4px;
        }

        .header-time {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
        }

        .header-time .current-time {
            font-size: 48px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: #212121;
        }

        .header-time .current-date {
            font-size: 17px;
            color: #757575;
        }

        .btn-toggle-fullscreen,
        .btn-theme-toggle {
            padding: 6px 16px;
            font-size: 14px;
            border-radius: 999px;
            border: 1px solid #bdbdbd;
            background: #fff;
            color: #424242;
            cursor: pointer;
            transition: all .2s;
            font-family: inherit;
        }

        .btn-toggle-fullscreen:hover,
        .btn-theme-toggle:hover {
            background: #e0e0e0;
        }

        .btn-secondary {
            background: #e3f2fd;
            color: #424242;
            border: 1px solid #bdbdbd;
            padding: 8px 18px;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all .2s;
            font-family: inherit;
        }

        .btn-secondary:hover {
            background: #bbdefb;
        }

        .controls {
            background: #fff;
            padding: 14px 40px;
            display: flex;
            gap: 14px;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 1px solid #e0e0e0;
        }

        .controls button {
            padding: 10px 28px;
            font-size: 17px;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            transition: all .3s;
            letter-spacing: 1px;
        }

        .btn-search {
            background: linear-gradient(135deg, #1976d2, #42a5f5);
            color: #fff;
        }

        .btn-search:hover {
            background: linear-gradient(135deg, #1565c0, #2196f3);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(25, 118, 210, .4);
        }

        .status-bar {
            background: #fafafa;
            padding: 9px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: #757575;
            border-bottom: 1px solid #e0e0e0;
        }

        .status-bar .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4caf50;
            animation: pulse 2s infinite;
        }

        .status-dot.error {
            background: #f44336;
            animation: none;
        }

        .status-dot.loading {
            background: #ff9800;
            animation: pulse .5s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: .4
            }
        }

        .table-header {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr 1.8fr 60px;
            padding: 12px 32px;
            background: #f0f0f0;
            font-size: 13px;
            font-weight: 700;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 3px;
            border-bottom: 2px solid #ddd;
            position: sticky;
            top: 100px;
            z-index: 50;
        }

        .table-header>div {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .table-header>div:nth-child(2) {
            justify-content: flex-start;
            padding-left: 20px;
        }

        .bus-rows-container {
            max-height: calc(100vh - 280px);
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #bdbdbd transparent;
        }

        .bus-rows-container::-webkit-scrollbar {
            width: 6px;
        }

        .bus-rows-container::-webkit-scrollbar-thumb {
            background: #bdbdbd;
            border-radius: 3px;
        }

        body.dark-mode .bus-rows-container {
            scrollbar-color: #1565c0 transparent;
        }

        body.dark-mode .bus-rows-container::-webkit-scrollbar-thumb {
            background: #1565c0;
        }

        .bus-row {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr 1.8fr 60px;
            padding: 16px 32px;
            background: #fff;
            align-items: center;
            border-bottom: 1px solid rgba(0, 0, 0, .06);
            transition: background .2s;
            position: relative;
        }

        body.dark-mode .bus-row {
            border-bottom-color: rgba(255, 255, 255, .06);
        }

        .bus-row.row-enter {
            animation: fadeInRow .4s ease forwards;
            opacity: 0;
        }

        @keyframes fadeInRow {
            from {
                opacity: 0;
                transform: translateY(8px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .bus-row:hover {
            background: #f8fafc;
        }

        body.dark-mode .bus-row:hover {
            background: rgba(255, 255, 255, .05) !important;
        }

        .row-accent {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 5px;
            border-radius: 0 3px 3px 0;
        }

        .row-accent.accent-ctb {
            background: linear-gradient(180deg, #FFE680, #FFDA44);
        }

        .row-accent.accent-kmb {
            background: linear-gradient(180deg, #EF5350, #C62828);
        }

        .row-accent.accent-lwb {
            background: linear-gradient(180deg, #FFA726, #E65100);
        }

        .row-accent.accent-nlb {
            background: linear-gradient(180deg, #66BB6A, #2E7D32);
        }

        .row-accent.accent-mtr {
            background: linear-gradient(180deg, #78909C, #455A64);
        }

        .row-accent.accent-night {
            background: linear-gradient(180deg, #7986CB, #283593);
        }

        .row-accent.accent-express {
            background: linear-gradient(180deg, #42A5F5, #1565C0);
        }

        .row-accent.accent-special {
            background: linear-gradient(180deg, #BA68C8, #6A1B9A);
        }

        .row-accent.accent-joint {
            background: linear-gradient(180deg, #EF5350, #FFDA44);
        }

        .route-cell {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .route-number {
            font-family: 'Noto Sans HK', 'Arial', sans-serif;
            font-weight: 700;
            font-size: 72px;
            line-height: 1;
            letter-spacing: -1px;
        }

        .route-co-ctb .route-number {
            color: #FFCA28;
        }

        .route-co-nwfb .route-number {
            color: #D32F2F;
        }

        .route-co-kmb .route-number {
            color: #C62828;
        }

        .route-co-lwb .route-number {
            color: #E65100;
        }

        .route-co-nlb .route-number {
            color: #2E7D32;
        }

        .route-co-mtr .route-number {
            color: #455A64;
        }

        .route-type-night .route-number {
            color: #3949AB;
        }

        .route-type-express .route-number {
            color: #1976D2;
        }

        .route-type-special .route-number {
            color: #7B1FA2;
        }

        body.dark-mode .route-co-ctb .route-number {
            color: #FFE082;
        }

        body.dark-mode .route-co-nwfb .route-number {
            color: #EF5350;
        }

        body.dark-mode .route-co-kmb .route-number {

<body>

    <div class="header">
        <div class="header-title">
            <span class="icon">🚌</span>
            <div>
                <h1>巴士到站時間預報</h1>
                <div class="subtitle">Bus Estimated Time of Arrival</div>
            </div>
        </div>
        <div class="header-time">
            <div>
                <div class="current-time" id="currentTime">--:--:--</div>
                <div class="current-date" id="currentDate">----年--月--日</div>
            </div>
            <div style="display:flex;gap:8px;margin-top:4px;justify-content:flex-end;">
                <button class="btn-theme-toggle" id="themeToggleBtn" type="button"
                    onclick="toggleThemeMode()">深色模式</button>
                <button class="btn-toggle-fullscreen" id="fullscreenToggleBtn"
                    onclick="toggleFullscreenMode()">全螢幕模式</button>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn-secondary" type="button" onclick="openStopSelector()">選擇路線 / 巴士站</button>
        <button class="btn-secondary" type="button" onclick="clearAllStops()" id="clearBtn"
            style="display:none;">清除所有站點</button>
        <button class="btn-search" onclick="currentStops.length>0?fetchMultiETA():null">查詢 / 重新整理</button>
    </div>

    <div class="status-bar">
        <div class="status-indicator">
            <div class="status-dot" id="statusDot"></div><span id="statusText">等待查詢...</span>
        </div>
        <div><span id="lastUpdate">最後更新：--</span>&nbsp;|&nbsp;<span>自動更新：每15秒</span>&nbsp;|&nbsp;<span
                id="recordCount">顯示 0 條記錄</span></div>
    </div>

    <div class="table-header">
        <div>路線</div>
        <div>目的地 / 巴士站</div>
        <div>巴士公司</div>
        <div>預計到站</div>
        <div></div>
    </div>

    <div class="bus-rows-container" id="busRowsContainer">
        <div class="message-container">
            <div class="icon">🔍</div>
            <div class="text">請選擇路線及巴士站以查詢到站時間</div>
            <div class="subtext">按上方「選擇路線 / 巴士站」按鈕開始</div>
        </div>
    </div>

    <div class="modal-backdrop" id="stopSelectorModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-header-title">選擇路線及巴士站</div>
                <button class="modal-close-btn" type="button" onclick="closeStopSelector()">✕</button>
            </div>
            <div class="modal-body">
                <div class="modal-left">
                    <div class="modal-label">巴士公司</div>
                    <div class="company-selector" id="companySelector">
                        <button type="button" class="company-btn active" data-co="CTB"
                            onclick="selectCompany('CTB')">城巴</button>
                        <button type="button" class="company-btn" data-co="KMB"
                            onclick="selectCompany('KMB')">九巴</button>
                        <button type="button" class="company-btn" data-co="LWB"
                            onclick="selectCompany('LWB')">龍運</button>

                            onclick="selectCompany('NLB')">嶼巴</button>

                    <div class="modal-route-filter">
                        <div class="modal-label">路線（輸入以篩選）</div>
                        <input type="text" id="routeFilterInput" placeholder="例如：1, 11, A21..."
                            oninput="filterRouteOptions()">
                    </div>
                    <select id="routeSelect" size="9" onchange="onRouteSelectChange()"></select>
                    <div class="modal-label" id="directionLabel">方向</div>
                    <div class="direction-buttons" id="directionButtons">
                        <button type="button" class="direction-button" id="dirInboundBtn"
                            onclick="setSelectedDirection('inbound')">往起點</button>
                        <button type="button" class="direction-button" id="dirOutboundBtn"
                            onclick="setSelectedDirection('outbound')">往終點</button>
                    </div>
                    <button type="button" class="modal-load-stops-btn" id="loadStopsBtn"
                        onclick="loadStopsForSelection()">載入巴士站</button>
                </div>
                <div class="modal-right">
                    <div class="modal-right-title" id="selectedRouteTitle">請先選擇巴士公司、路線及方向</div>
                    <div class="stop-list" id="stopList">

                    </div>

            </div>
            <div class="modal-footer">提示：點擊巴士站可新增/移除站點。站點會自動保存。ESC關閉。</div>
        </div>

    <script>
        const JOINT_ROUTES = new Set([
            '101', '102', '104', '105', '106', '107', '108', '109',
            '110', '111', '112', '113', '115', '116', '118', 'N121',
            '170', '171', '182', '182P', 'N182',
            '307', '307P', 'N307',
            '619', '680', '681', '682', '690',
        ]);

        const COMPANY_LOGOS = {
            CTB: 'https://www.citybus.com.hk/_common/images/logo.png',
            KMB: 'https://upload.wikimedia.org/wikipedia/en/thumb/b/b4/KowloonMotorBus.svg/3840px-KowloonMotorBus.svg.png',
            LWB: 'https://upload.wikimedia.org/wikipedia/en/thumb/f/f1/Long_Win_Bus_logo.svg/500px-Long_Win_Bus_logo.svg.png',
            NLB: 'https://www.td.gov.hk/filemanager/en/content_391/nlb_logo-color-v.png',
            MTR: 'https://upload.wikimedia.org/wikipedia/en/thumb/b/b9/HK_MTR_logo.svg/960px-HK_MTR_logo.svg.png',
            NWFB: 'https://www.citybus.com.hk/_common/images/logo.png',
        };

        const logoLoadCache = {};
        function testLogoUrl(url) {
            if (url in logoLoadCache) return Promise.resolve(logoLoadCache[url]);
            return new Promise(resolve => {
                const img = new Image();
                img.onload = () => { logoLoadCache[url] = true; resolve(true); };
                img.onerror = () => { logoLoadCache[url] = false; resolve(false); };
                img.src = url;
            });
        }
        Object.values(COMPANY_LOGOS).forEach(url => testLogoUrl(url));

        const LWB_ROUTE_PREFIXES = ['A', 'B', 'E', 'R', 'S'];
        function isLwbRoute(r) { r = r.toUpperCase(); return LWB_ROUTE_PREFIXES.some(p => r.startsWith(p) && /^[A-Z]\d/.test(r)); }

        const API = {
            CTB: {
                routeList: 'https://rt.data.gov.hk/v2/transport/citybus/route/CTB',
                routeStop: (route, dir) => `https://rt.data.gov.hk/v2/transport/citybus/route-stop/CTB/${route}/${dir}`,
                stop: (id) => `https://rt.data.gov.hk/v2/transport/citybus/stop/${id}`,
                eta: (stopId, route) => `https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/${stopId}/${route}`,
            },
            KMB: {
                routeList: 'https://data.etabus.gov.hk/v1/transport/kmb/route/',
                routeStop: (route, dir, st) => `https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${route}/${dir}/${st || 1}`,
                stop: (id) => `https://data.etabus.gov.hk/v1/transport/kmb/stop/${id}`,
                eta: (stopId, route, st) => `https://data.etabus.gov.hk/v1/transport/kmb/eta/${stopId}/${route}/${st || 1}`,
            },
            NLB: {
                routeList: 'https://rt.data.gov.hk/v1/transport/nlb/route.php?action=list',
                routeStop: (routeId) => `https://rt.data.gov.hk/v2/transport/nlb/stop.php?action=list&routeId=${routeId}`,
                eta: (stopId, routeId) => `https://rt.data.gov.hk/v2/transport/nlb/stop.php?action=estimatedArrivals&routeId=${routeId}&stopId=${stopId}&language=zh`,
            }
        };

        const REFRESH_INTERVAL = 15000;
        const STORAGE_KEY = 'busEtaStops_v2';

        let refreshTimer = null, stopNameCache = {}, routeListCache = {};
        let currentStops = [], explicitTheme = null, selectedDirection = null;
        let selectedCompany = 'CTB', isFullscreenMode = false;
        let renderedRows = new Map(), isFirstRender = true;

        function makeStopKey(sd) {
            const dir = sd.company === 'NLB' ? 'nlb' : (sd.direction || 'none');
            const routeId = sd.company === 'NLB' ? (sd.nlbRouteId || sd.routeId) : sd.routeId;
            return `${sd.company}||${routeId}||${sd.stopId}||${dir}`;
        }

        function saveStopsToStorage() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(currentStops.map(s => ({
                    stopId: s.stopId, routeId: s.routeId, nlbRouteId: s.nlbRouteId,
                    direction: s.direction, company: s.company, serviceType: s.serviceType,
                    nlbDest: s.nlbDest || '',
                    stopInfoCache: s.stopInfo,
                    altStopName: s.altStopName || null   // persist the KMB alt name
                }))));
            } catch (e) { }
        }

        function loadStopsFromStorage() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (!stored) return false;
                const data = JSON.parse(stored);
                if (!Array.isArray(data) || !data.length) return false;
                currentStops = data.map(s => ({
                    stopId: s.stopId, routeId: s.routeId, nlbRouteId: s.nlbRouteId || null,
                    direction: s.direction || null, company: s.company, serviceType: s.serviceType || 1,
                    nlbDest: s.nlbDest || '', stopInfo: s.stopInfoCache || null,
                    altStopName: s.altStopName || null
                }));
                updateClearButton(); return true;
            } catch (e) { return false; }
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('currentTime').textContent = now.toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
            const d = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            document.getElementById('currentDate').textContent = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 ${d[now.getDay()]}`;
        }
        setInterval(updateClock, 1000); updateClock();

        function applyTheme(t) { document.body.classList.toggle('dark-mode', t === 'dark'); const b = document.getElementById('themeToggleBtn'); if (b) b.textContent = t === 'dark' ? '淺色模式' : '深色模式'; }
        function loadThemePreference() {
            const s = localStorage.getItem('busEtaTheme');
            if (s === 'light' || s === 'dark') { explicitTheme = s; applyTheme(s); }
            else applyTheme(window.matchMedia && window.matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
            if (window.matchMedia) window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change', e => { if (!explicitTheme) applyTheme(e.matches ? 'dark' : 'light'); });
        }
        function toggleThemeMode() { const next = document.body.classList.contains('dark-mode') ? 'light' : 'dark'; explicitTheme = next; localStorage.setItem('busEtaTheme', next); applyTheme(next); }

        function setStatus(state, text) {
            const d = document.getElementById('statusDot'); d.className = 'status-dot';
            if (state === 'loading') d.classList.add('loading');
            if (state === 'error') d.classList.add('error');
            document.getElementById('statusText').textContent = text;
        }

        // ════════════════════════════════════════════
        //  fetchStopName — tries primary operator first,
        //  then the OTHER operator for joint routes.
        //  Returns { name_tc, name_en } for primary co.
        // ════════════════════════════════════════════
        async function fetchStopNameFromCo(id, co) {
            const key = `${co}_${id}`;
            if (stopNameCache[key]) return stopNameCache[key];
            try {
                const url = (co === 'KMB' || co === 'LWB') ? API.KMB.stop(id) : API.CTB.stop(id);
                const r = await fetch(url);
                const d = await r.json();
                if (d.data && d.data.name_tc) {
                    const info = { name_tc: d.data.name_tc, name_en: d.data.name_en || '' };
                    stopNameCache[key] = info;
                    return info;
                }
            } catch (e) { }
            return null;
        }

        // For joint routes: fetch stop name from BOTH operators.
        // Returns { primary, alt } where alt is the other operator's name (if different).
        async function fetchStopNames(id, primaryCo, isJoint) {
            if (primaryCo === 'NLB') return { primary: { name_tc: id, name_en: '' }, alt: null };

            const primary = await fetchStopNameFromCo(id, primaryCo) || { name_tc: id, name_en: '' };

            if (!isJoint) return { primary, alt: null };

            // For joint routes: also fetch from the OTHER operator
            const otherCo = (primaryCo === 'CTB' || primaryCo === 'NWFB') ? 'KMB' : 'CTB';
            const other = await fetchStopNameFromCo(id, otherCo);

            // Only show alt name if it's actually different from the primary name
            if (other && other.name_tc && other.name_tc !== primary.name_tc) {
                return { primary, alt: { name_tc: other.name_tc, name_en: other.name_en, co: otherCo } };
            }
            return { primary, alt: null };
        }

        // Simple single-name fetch (backwards compat)
        async function fetchStopName(id, company) {
            const co = (company || 'CTB').toUpperCase();
            if (co === 'NLB') return { name_tc: id, name_en: '' };
            const info = await fetchStopNameFromCo(id, co);
            return info || { name_tc: id, name_en: '' };
        }

        function getCompanyName(c) { return { CTB: '城巴', NWFB: '城巴', KMB: '九巴', LWB: '龍運', NLB: '嶼巴', MTR: '港鐵巴士' }[c] || c; }
        function getCompanyClass(c) { return { CTB: 'ctb', NWFB: 'ctb', KMB: 'kmb', LWB: 'lwb', NLB: 'nlb', MTR: 'mtr' }[c] || 'ctb'; }

        function showMessage(icon, text, sub) {
            renderedRows.clear(); isFirstRender = true;
            document.getElementById('busRowsContainer').innerHTML = `<div class="message-container"><div class="icon">${icon}</div><div class="text">${text}</div>${sub ? `<div class="subtext">${sub}</div>` : ''}</div>`;
            document.getElementById('recordCount').textContent = '顯示 0 條記錄';
        }

        function getRouteColorClass(routeNo, co) {
            const r = routeNo.toUpperCase(), company = (co || '').toUpperCase();
            if (company === 'LWB' || (company === 'KMB' && isLwbRoute(r))) return 'route-co-lwb';
            if (r.startsWith('N')) return 'route-type-night';
            if (r.endsWith('X') && !isLwbRoute(r)) return 'route-type-express';
            if (r.startsWith('R') && !isLwbRoute(r)) return 'route-type-special';
            switch (company) { case 'CTB': case 'NWFB': return 'route-co-ctb'; case 'KMB': return 'route-co-kmb'; case 'NLB': return 'route-co-nlb'; case 'MTR': return 'route-co-mtr'; default: return 'route-co-ctb'; }
        }
        function getAccentClass(routeNo, co, isJoint) {
            if (isJoint) return 'accent-joint';
            const r = routeNo.toUpperCase(), company = (co || '').toUpperCase();
            if (company === 'LWB' || (company === 'KMB' && isLwbRoute(r))) return 'accent-lwb';
            if (r.startsWith('N')) return 'accent-night';
            if (r.endsWith('X') && !isLwbRoute(r)) return 'accent-express';
            if (r.startsWith('R') && !isLwbRoute(r)) return 'accent-special';
            switch (company) { case 'CTB': case 'NWFB': return 'accent-ctb'; case 'KMB': return 'accent-kmb'; case 'NLB': return 'accent-nlb'; case 'MTR': return 'accent-mtr'; default: return 'accent-ctb'; }
        }

        function buildRouteCell(routeNo, co) {
            return `<div class="route-cell ${getRouteColorClass(routeNo, co)}"><span class="route-number">${routeNo}</span></div>`;
        }

        // ════════════════════════════════════════════
        //  buildCompanyCell — with enlarged CTB/NLB logos
        // ════════════════════════════════════════════
        async function buildSingleLogoEl(co) {
            const logoUrl = COMPANY_LOGOS[co];
            if (logoUrl) {
                const ok = await testLogoUrl(logoUrl);
                if (ok) {
                    const isDark = document.body.classList.contains('dark-mode');
                    const img = document.createElement('img');
                    img.src = logoUrl; img.alt = getCompanyName(co);
                    // Base class + size modifier for CTB and NLB
                    let cls = 'company-logo';
                    if (co === 'CTB' || co === 'NWFB') cls += ' logo-ctb';
                    else if (co === 'NLB') cls += ' logo-nlb';
                    if (['KMB', 'LWB', 'MTR'].includes(co) && isDark) cls += ' logo-on-dark';
                    img.className = cls;
                    return img;
                }
            }
            const span = document.createElement('span');
            span.className = `company-tag ${getCompanyClass(co)}`;
            span.textContent = getCompanyName(co);
            return span;
        }

        async function buildCompanyCell(co, isJoint) {
            const div = document.createElement('div');
            div.className = 'company-cell';

            if (isJoint) {
                // Stack CTB logo above KMB logo
                const group = document.createElement('div');
                group.className = 'co-badge-group';
                for (const c of ['CTB', 'KMB']) {
                    const el = await buildSingleLogoEl(c);
                    group.appendChild(el);
                }
                div.appendChild(group);
                return div;
            }

            const el = await buildSingleLogoEl(co);
            div.appendChild(el);
            return div;
        }

        function getEtaInfo(item) {
            const diff = Math.floor((new Date(item.eta) - Date.now()) / 60000);
            let cls, txt;
            if (diff <= 0) { cls = 'eta-arriving'; txt = '到站'; }
            else if (diff <= 3) { cls = 'eta-arriving'; txt = diff; }
            else if (diff <= 10) { cls = 'eta-soon'; txt = diff; }
            else { cls = 'eta-normal'; txt = diff; }
            return { cls, txt, diff, rmk: item.rmk_tc || '' };
        }
        function getEtaSignature(etas) { return etas.map(e => `${e.eta}|${e.rmk_tc || ''}`).join(';;'); }

        function buildEtaCellContent(etas) {
            if (!etas.length) return '<span class="eta-na">暫無班次</span>';
            const sorted = etas.sort((a, b) => a.eta_seq - b.eta_seq).slice(0, 4);
            const primary = sorted[0], secondary = sorted.slice(1);
            const pInfo = getEtaInfo(primary);
            let html = `<div class="eta-primary ${pInfo.cls}">`;
            html += pInfo.diff <= 0 ? `<span class="eta-min">${pInfo.txt}</span>` : `<span class="eta-min">${pInfo.txt}</span><span class="eta-unit">分鐘</span>`;
            if (pInfo.rmk) html += `<span class="eta-rmk">${pInfo.rmk}</span>`;
            html += '</div>';
            if (secondary.length) {
                html += '<div class="eta-secondary">';
                secondary.forEach(item => {
                    const info = getEtaInfo(item);
                    html += `<div class="eta-row ${info.cls}">`;
                    html += info.diff <= 0 ? `<span class="eta-min">${info.txt}</span>` : `<span class="eta-min">${info.txt}</span><span class="eta-unit">分</span>`;
                    if (info.rmk) html += `<span class="eta-rmk">${info.rmk}</span>`;
                    html += '</div>';
                });
                html += '</div>';
            }
            return html;
        }

        function updateEtaCell(rowEl, etas) {
            const cell = rowEl.querySelector('.eta-cell'); if (!cell) return;
            cell.innerHTML = buildEtaCellContent(etas);
            cell.classList.remove('eta-updated'); void cell.offsetWidth;
            cell.classList.add('eta-updated');
            setTimeout(() => cell.classList.remove('eta-updated'), 600);
        }

        // ════════════════════════════════════════════
        //  buildBusRow — now accepts stopNames object
        //  { primary, alt } to show both operator names
        // ════════════════════════════════════════════
        async function buildBusRow(entry, stopNames, isNew, stopKey, isJoint) {
            const row = document.createElement('div');
            row.className = 'bus-row' + (isNew ? ' row-enter' : '');
            row.dataset.stopKey = stopKey;

            let displayCo = entry.co || 'CTB';
            if (displayCo === 'KMB' && isLwbRoute(entry.route)) displayCo = 'LWB';

            const accent = document.createElement('div');
            accent.className = 'row-accent ' + getAccentClass(entry.route, displayCo, isJoint);
            row.appendChild(accent);

            const rd = document.createElement('div');
            rd.innerHTML = buildRouteCell(entry.route, isJoint ? 'CTB' : displayCo);

            // ── Stop cell: direction on top, primary name, optional alt name ──
            const primary = stopNames.primary || { name_tc: '--', name_en: '' };
            const alt = stopNames.alt;

            const sd = document.createElement('div'); sd.className = 'stop-cell';
            let stopHtml = `
        <div class="dest-direction">${entry.dest_tc || '--'}</div>
        <div class="stop-name">${primary.name_tc}
            <div class="stop-name-en">${primary.name_en || ''}</div>
        </div>`;
            // Show alt (KMB) name below if different
            if (alt && alt.name_tc) {
                stopHtml += `<div class="stop-name-alt"><span class="alt-badge">${getCompanyName(alt.co)}</span>${alt.name_tc}</div>`;
            }
            sd.innerHTML = stopHtml;

            const cd = await buildCompanyCell(displayCo, isJoint);

            const ed = document.createElement('div'); ed.className = 'eta-cell';
            ed.innerHTML = buildEtaCellContent(entry.etas);

            const rm = document.createElement('div'); rm.className = 'remove-cell';
            rm.innerHTML = `<button class="row-remove-btn" title="移除此站點">✕</button>`;
            rm.querySelector('button').onclick = (e) => { e.stopPropagation(); removeStopByKey(stopKey); };

            row.append(rd, sd, cd, ed, rm);
            return row;
        }

        function removeStopByKey(stopKey) {
            const idx = currentStops.findIndex(s => makeStopKey(s) === stopKey);
            if (idx >= 0) {
                currentStops.splice(idx, 1); saveStopsToStorage(); updateClearButton();
                if (renderedRows.has(stopKey)) { renderedRows.get(stopKey).element.remove(); renderedRows.delete(stopKey); }
                if (!currentStops.length) { showMessage('🔍', '請選擇路線及巴士站以查詢到站時間', '按上方按鈕開始'); if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; } }
                else document.getElementById('recordCount').textContent = `顯示 ${currentStops.length} 個站點`;
            }
        }

        function groupEta(etaData, directionFilter, isNlbCompany, nlbDest) {
            const g = {};
            etaData.forEach(item => {
                const itemIsNlb = isNlbCompany || (item.co || '').toUpperCase() === 'NLB';
                if (!itemIsNlb && directionFilter) {
                    if (directionFilter === 'inbound' && item.dir !== 'I') return;
                    if (directionFilter === 'outbound' && item.dir !== 'O') return;
                }
                const k = `${item.route}:${item.dir}`;
                if (!g[k]) {
                    const dest = item.dest_tc || (itemIsNlb ? (nlbDest || '') : '');
                    g[k] = { route: item.route, dir: item.dir, co: item.co || 'CTB', dest_tc: dest, stop: item.stop, etas: [] };
                }
                if (item.dest_tc && !g[k].dest_tc) g[k].dest_tc = item.dest_tc;
                if (item.eta) g[k].etas.push({ eta: item.eta, rmk_tc: item.rmk_tc || '', eta_seq: 0 });
            });
            Object.values(g).forEach(entry => {
                entry.etas.sort((a, b) => new Date(a.eta) - new Date(b.eta));
                entry.etas.forEach((e, i) => e.eta_seq = i + 1);
                entry.etas = entry.etas.filter((e, i, arr) => i === 0 || Math.abs(new Date(e.eta) - new Date(arr[i - 1].eta)) > 30000);
            });
            return Object.values(g).sort((a, b) => { const an = parseInt(a.route) || 0, bn = parseInt(b.route) || 0; return an !== bn ? an - bn : a.route.localeCompare(b.route); });
        }

        async function fetchCtbEta(stopId, route) { try { const r = await fetch(API.CTB.eta(stopId, route)); if (!r.ok) return []; const d = await r.json(); return (d.data || []).map(x => ({ ...x, co: x.co || 'CTB' })); } catch (e) { return []; } }
        async function fetchKmbEta(stopId, route, st) { try { const r = await fetch(API.KMB.eta(stopId, route, st || 1)); if (!r.ok) return []; const d = await r.json(); return (d.data || []).map(x => ({ ...x, co: x.co || 'KMB' })); } catch (e) { return []; } }
        async function fetchNlbEta(stopId, nlbRouteId, routeNo, nlbDest) {
            try {
                const r = await fetch(API.NLB.eta(stopId, nlbRouteId)); if (!r.ok) return [];
                const d = await r.json();
                return (d.estimatedArrivals || []).map((x, i) => ({
                    route: routeNo, dir: 'O', co: 'NLB',
                    dest_tc: x.destination_zh || x.destination_tc || x.destination || nlbDest || '',
                    stop: stopId, eta: x.estimatedArrivalTime,
                    rmk_tc: x.remarks_zh || x.remarks_tc || x.remarks || '', eta_seq: i + 1
                }));
            } catch (e) { return []; }
        }

        async function fetchJointEta(sd) {
            const co = sd.company, route = sd.routeId.toUpperCase(), stopId = sd.stopId;
            if (co === 'NLB') return fetchNlbEta(stopId, sd.nlbRouteId || route, sd.routeId, sd.nlbDest || '');
            if (co === 'LWB') return fetchKmbEta(stopId, route, sd.serviceType);
            const isJoint = JOINT_ROUTES.has(route);
            if (isJoint) {
                const [ctbData, kmbData] = await Promise.all([fetchCtbEta(stopId, route), fetchKmbEta(stopId, route, sd.serviceType)]);
                return [...ctbData, ...kmbData];
            }
            if (co === 'CTB') return fetchCtbEta(stopId, route);
            if (co === 'KMB') return fetchKmbEta(stopId, route, sd.serviceType);
            return [];
        }

        // ════════════════════════════════════════════
        //  Smart update — uses stopNames object
        // ════════════════════════════════════════════
        async function smartUpdateRows(results) {
            const container = document.getElementById('busRowsContainer');
            const newKeys = new Set(), toAdd = [];
            for (const result of results) {
                if (!result.etaData.length) continue;
                const isNlb = result.company === 'NLB';
                const isJoint = !isNlb && JOINT_ROUTES.has(result.routeId.toUpperCase());
                const entries = groupEta(result.etaData, result.direction, isNlb, result.nlbDest);
                for (const entry of entries) {
                    const stopKey = makeStopKey(result);
                    newKeys.add(stopKey);
                    const sig = getEtaSignature(entry.etas);
                    if (renderedRows.has(stopKey)) {
                        const ex = renderedRows.get(stopKey);
                        if (ex.etaSignature !== sig) { updateEtaCell(ex.element, entry.etas); ex.etaSignature = sig; }
                    } else {
                        toAdd.push({ entry, stopNames: result.stopNames, stopKey, sig, isJoint });
                    }
                }
            }
            for (const [key, data] of renderedRows) { if (!newKeys.has(key)) { data.element.remove(); renderedRows.delete(key); } }
            for (const { entry, stopNames, stopKey, sig, isJoint } of toAdd) {
                const row = await buildBusRow(entry, stopNames, true, stopKey, isJoint);
                container.appendChild(row);
                renderedRows.set(stopKey, { element: row, etaSignature: sig });
            }
        }

        async function fetchMultiETA() {
            if (!currentStops.length) { showMessage('⚠️', '請先選擇路線及巴士站', '按「選擇路線 / 巴士站」按鈕開始。'); setStatus('error', '尚未選擇'); return; }
            setStatus('loading', `正在查詢 ${currentStops.length} 個站點...`);
            const container = document.getElementById('busRowsContainer');
            if (refreshTimer) clearInterval(refreshTimer);
            try {
                const promises = currentStops.map(async sd => {
                    try {
                        const isNlb = sd.company === 'NLB';
                        const isJoint = !isNlb && JOINT_ROUTES.has(sd.routeId.toUpperCase());

                        // Fetch stop names for both operators on joint routes
                        let stopNames;
                        if (sd.stopInfo) {
                            // We already have the primary name; just need alt for joint
                            const primary = sd.stopInfo;
                            let alt = sd.altStopName || null;
                            if (isJoint && !alt) {
                                const otherCo = (sd.company === 'CTB' || sd.company === 'NWFB') ? 'KMB' : 'CTB';
                                const other = await fetchStopNameFromCo(sd.stopId, otherCo);
                                if (other && other.name_tc !== primary.name_tc) alt = { ...other, co: otherCo };
                                sd.altStopName = alt; // cache it
                            }
                            stopNames = { primary, alt };
                        } else {
                            const names = await fetchStopNames(sd.stopId, sd.company, isJoint);
                            sd.stopInfo = names.primary;
                            sd.altStopName = names.alt;
                            stopNames = names;
                        }

                        const etaData = await fetchJointEta(sd);
                        return {
                            stopId: sd.stopId, routeId: sd.routeId, nlbRouteId: sd.nlbRouteId || null,
                            direction: sd.direction, company: sd.company,
                            stopNames, nlbDest: sd.nlbDest || '', etaData
                        };
                    } catch (e) { return null; }
                });
                const results = (await Promise.all(promises)).filter(r => r);
                if (!results.length) { showMessage('🚏', '所有站點均無資料', '請檢查路線及站點'); setStatus('error', '無資料'); return; }

                if (isFirstRender) {
                    container.innerHTML = ''; renderedRows.clear();
                    for (const result of results) {
                        if (!result.etaData.length) continue;
                        const isNlb = result.company === 'NLB';
                        const isJoint = !isNlb && JOINT_ROUTES.has(result.routeId.toUpperCase());
                        const entries = groupEta(result.etaData, result.direction, isNlb, result.nlbDest);
                        for (const entry of entries) {
                            const stopKey = makeStopKey(result);
                            const row = await buildBusRow(entry, result.stopNames, true, stopKey, isJoint);
                            container.appendChild(row);
                            renderedRows.set(stopKey, { element: row, etaSignature: getEtaSignature(entry.etas) });
                        }
                    }
                    isFirstRender = false;
                } else {
                    await smartUpdateRows(results);
                }

                if (!container.children.length || container.querySelector('.message-container'))
                    showMessage('🚏', '暫無到站資料', '所選站點目前沒有巴士到站資訊');

                document.getElementById('lastUpdate').textContent = `最後更新：${new Date().toLocaleTimeString('zh-HK', { hour12: false })}`;
                document.getElementById('recordCount').textContent = `顯示 ${currentStops.length} 個站點`;
                setStatus('ok', `已更新 ${results.length}/${currentStops.length} 個站點`);
                refreshTimer = setInterval(fetchMultiETA, REFRESH_INTERVAL);
            } catch (e) { showMessage('❌', '查詢失敗', e.message); setStatus('error', `查詢失敗：${e.message}`); }
        }

        function toggleFullscreenMode() {
            isFullscreenMode = !isFullscreenMode;
            document.body.classList.toggle('fullscreen-mode', isFullscreenMode);
            const b = document.getElementById('fullscreenToggleBtn');
            if (b) b.textContent = isFullscreenMode ? '退出全螢幕' : '全螢幕模式';
        }
        function clearAllStops() {
            currentStops = []; saveStopsToStorage(); renderedRows.clear(); isFirstRender = true;
            showMessage('🔍', '請選擇路線及巴士站以查詢到站時間', '按上方按鈕開始');
            document.getElementById('recordCount').textContent = '顯示 0 條記錄';
            document.getElementById('clearBtn').style.display = 'none';
            if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
        }
        function updateClearButton() { const b = document.getElementById('clearBtn'); if (b) b.style.display = currentStops.length > 0 ? 'inline-block' : 'none'; }

        function selectCompany(co) {
            selectedCompany = co;
            document.querySelectorAll('.company-btn').forEach(b => b.classList.toggle('active', b.dataset.co === co));
            document.getElementById('routeFilterInput').value = '';
            document.getElementById('selectedRouteTitle').textContent = '請先選擇路線及方向';
            document.getElementById('stopList').innerHTML = '<div class="stop-list-empty">尚未載入巴士站。</div>';
            setSelectedDirection(null);
            const isNlb = co === 'NLB';
            document.getElementById('directionLabel').style.display = isNlb ? 'none' : '';
            document.getElementById('directionButtons').style.display = isNlb ? 'none' : '';
            loadRouteList(co);
        }

        async function loadRouteList(co) {
            const apiCo = (co === 'LWB') ? 'KMB' : co;
            if (routeListCache[co]) { populateRouteSelect(routeListCache[co], co); return; }
            const sel = document.getElementById('routeSelect'); sel.innerHTML = '<option disabled>載入中...</option>';
            try {
                if (apiCo === 'CTB') {
                    const r = await fetch(API.CTB.routeList); const d = await r.json();
                    const list = (d.data || []).map(x => ({ route: x.route, orig_tc: x.orig_tc, dest_tc: x.dest_tc, co: 'CTB' }));
                    routeListCache.CTB = list; populateRouteSelect(list, 'CTB');
                } else if (apiCo === 'KMB') {
                    if (!routeListCache._KMB_RAW) { const r = await fetch(API.KMB.routeList); const d = await r.json(); routeListCache._KMB_RAW = d.data || []; }
                    const raw = routeListCache._KMB_RAW;
                    const kmbRoutes = [], lwbRoutes = [], seenK = {}, seenL = {};
                    raw.forEach(x => {
                        if (isLwbRoute(x.route)) { if (!seenL[x.route]) { seenL[x.route] = true; lwbRoutes.push({ route: x.route, orig_tc: x.orig_tc, dest_tc: x.dest_tc, co: 'LWB', service_type: x.service_type, bound: x.bound }); } }
                        else { if (!seenK[x.route]) { seenK[x.route] = true; kmbRoutes.push({ route: x.route, orig_tc: x.orig_tc, dest_tc: x.dest_tc, co: 'KMB', service_type: x.service_type, bound: x.bound }); } }
                    });
                    routeListCache._KMB_FULL = raw;
                    if (co === 'KMB') { routeListCache.KMB = kmbRoutes; populateRouteSelect(kmbRoutes, 'KMB'); }
                    if (co === 'LWB') { routeListCache.LWB = lwbRoutes; populateRouteSelect(lwbRoutes, 'LWB'); }
                    if (co === 'KMB' && !routeListCache.LWB) routeListCache.LWB = lwbRoutes;
                    if (co === 'LWB' && !routeListCache.KMB) routeListCache.KMB = kmbRoutes;
                } else if (apiCo === 'NLB') {
                    const r = await fetch(API.NLB.routeList); const d = await r.json();
                    const list = (d.routes || []).map(x => ({ route: x.routeNo, orig_tc: x.routeName_c || x.routeNo, dest_tc: x.routeName_c || '', co: 'NLB', nlbRouteId: x.routeId }));
                    routeListCache.NLB = list; populateRouteSelect(list, 'NLB');
                }
            } catch (e) { sel.innerHTML = '<option disabled>載入失敗</option>'; }
        }

        function populateRouteSelect(list, co) {
            const s = document.getElementById('routeSelect'); s.innerHTML = '';
            [...list].sort((a, b) => { const an = parseInt(a.route) || 0, bn = parseInt(b.route) || 0; return an !== bn ? an - bn : a.route.localeCompare(b.route); }).forEach(r => {
                const o = document.createElement('option');
                o.value = r.route;
                o.textContent = co === 'NLB' ? `${r.route} — ${r.orig_tc}` : `${r.route} — ${r.orig_tc || ''} ↔ ${r.dest_tc || ''}`;
                o.dataset.origTc = r.orig_tc || ''; o.dataset.destTc = r.dest_tc || ''; o.dataset.co = co;
                if (r.nlbRouteId) o.dataset.nlbRouteId = r.nlbRouteId;
                s.appendChild(o);
            });
        }

        function openStopSelector() {
            document.getElementById('stopSelectorModal').classList.add('active');
            document.getElementById('routeFilterInput').value = '';
            document.getElementById('selectedRouteTitle').textContent = '請先選擇巴士公司、路線及方向';
            document.getElementById('stopList').innerHTML = '<div class="stop-list-empty">尚未載入巴士站。</div>';
            setSelectedDirection(null);
            const isNlb = selectedCompany === 'NLB';
            document.getElementById('directionLabel').style.display = isNlb ? 'none' : '';
            document.getElementById('directionButtons').style.display = isNlb ? 'none' : '';
            loadRouteList(selectedCompany);
        }
        function closeStopSelector() { document.getElementById('stopSelectorModal').classList.remove('active'); }
        function filterRouteOptions() {
            const v = document.getElementById('routeFilterInput').value.trim().toLowerCase();
            Array.from(document.getElementById('routeSelect').options).forEach(o => { o.style.display = o.textContent.toLowerCase().includes(v) ? '' : 'none'; });
        }
        function onRouteSelectChange() {
            const s = document.getElementById('routeSelect'), o = s.options[s.selectedIndex], t = document.getElementById('selectedRouteTitle');
            if (!o) { t.textContent = '請先選擇路線及方向'; return; }
            t.textContent = selectedCompany === 'NLB' ? `已選路線：${o.value}（${o.dataset.origTc || ''}）` : `已選路線：${o.value}（${o.dataset.origTc || ''} ↔ ${o.dataset.destTc || ''}）`;
        }
        function setSelectedDirection(dir) {
            selectedDirection = dir;
            document.getElementById('dirInboundBtn').classList.toggle('active', dir === 'inbound');
            document.getElementById('dirOutboundBtn').classList.toggle('active', dir === 'outbound');
        }

        async function loadStopsForSelection() {
            const sel = document.getElementById('routeSelect'), btn = document.getElementById('loadStopsBtn');
            const list = document.getElementById('stopList'), title = document.getElementById('selectedRouteTitle');
            const opt = sel.options[sel.selectedIndex];
            if (!opt) { list.innerHTML = '<div class="stop-list-empty">請先選擇路線。</div>'; return; }
            const co = selectedCompany, route = opt.value;
            if (co !== 'NLB' && !selectedDirection) { list.innerHTML = '<div class="stop-list-empty">請先選擇方向。</div>'; return; }
            if (btn) btn.disabled = true; list.innerHTML = '<div class="stop-list-empty">正在載入...</div>';
            try {
                if (co === 'CTB') {
                    const r = await fetch(API.CTB.routeStop(route, selectedDirection)); if (!r.ok) { list.innerHTML = '<div class="stop-list-empty">載入失敗</div>'; return; }
                    const d = await r.json(); const stops = d.data || [];
                    if (!stops.length) { list.innerHTML = '<div class="stop-list-empty">此方向沒有巴士站資料。</div>'; return; }
                    list.innerHTML = '';
                    for (const s of stops) { const info = await fetchStopName(s.stop, 'CTB'); appendStopItem(list, s.stop, route, info, 'CTB', null, null, null); }
                } else if (co === 'KMB' || co === 'LWB') {
                    const kmbDir = selectedDirection === 'inbound' ? 'inbound' : 'outbound';
                    let st = 1;
                    if (routeListCache._KMB_FULL) { const bound = selectedDirection === 'inbound' ? 'I' : 'O'; const m = routeListCache._KMB_FULL.find(x => x.route === route && x.bound === bound); if (m) st = m.service_type || 1; }
                    const r = await fetch(API.KMB.routeStop(route, kmbDir, st)); if (!r.ok) { list.innerHTML = '<div class="stop-list-empty">載入失敗</div>'; return; }
                    const d = await r.json(); const stops = d.data || [];
                    if (!stops.length) { list.innerHTML = '<div class="stop-list-empty">此方向沒有巴士站資料。</div>'; return; }
                    list.innerHTML = '';
                    for (const s of stops) { const info = await fetchStopName(s.stop, 'KMB'); appendStopItem(list, s.stop, route, info, co, st, null, null); }
                } else if (co === 'NLB') {
                    const nlbRouteId = opt.dataset.nlbRouteId || '';
                    const nlbDest = opt.dataset.destTc || opt.dataset.origTc || route;
                    if (!nlbRouteId) { list.innerHTML = '<div class="stop-list-empty">無法取得路線ID。</div>'; return; }
                    const r = await fetch(API.NLB.routeStop(nlbRouteId)); if (!r.ok) { list.innerHTML = `<div class="stop-list-empty">載入失敗 (HTTP ${r.status})</div>`; return; }
                    const d = await r.json(); const stops = d.stops || [];
                    if (!stops.length) { list.innerHTML = '<div class="stop-list-empty">沒有巴士站資料。</div>'; return; }
                    list.innerHTML = '';
                    for (const s of stops) {
                        const nameTc = s.stopName_zh || s.stopName_c || s.stopId || '';
                        const nameEn = s.stopName_en || s.stopName_e || '';
                        const stopId = s.stopId || s.stop || '';
                        const info = { name_tc: nameTc, name_en: nameEn };
                        stopNameCache[`NLB_${stopId}`] = info;
                        appendStopItem(list, stopId, route, info, 'NLB', null, nlbRouteId, nlbDest);
                    }
                }
                if (title) title.textContent = selectedCompany === 'NLB' ? `已選路線：${route}（${opt.dataset.origTc || ''}）` : `已選路線：${route}（${opt.dataset.origTc || ''} ↔ ${opt.dataset.destTc || ''}）`;
            } catch (e) { console.error('loadStopsForSelection error', e); list.innerHTML = '<div class="stop-list-empty">載入錯誤。</div>'; }
            finally { if (btn) btn.disabled = false; }
        }

        function appendStopItem(container, stopId, route, info, company, serviceType, nlbRouteId, nlbDest) {
            const item = document.createElement('div'); item.className = 'stop-list-item';
            item.onclick = () => selectStopFromModal(stopId, route, info, company, serviceType, nlbRouteId, nlbDest);
            item.innerHTML = `<div class="stop-list-item-main">${info.name_tc || stopId}</div><div class="stop-list-item-sub">${info.name_en || ''} （站號：${stopId}）</div>`;
            container.appendChild(item);
        }

        async function selectStopFromModal(stopId, routeNo, stopInfo, company, serviceType, nlbRouteId, nlbDest) {
            const dir = company === 'NLB' ? null : selectedDirection;
            const sd = {
                stopId, routeId: routeNo, nlbRouteId: nlbRouteId || null,
                direction: dir, company: company || selectedCompany,
                serviceType: serviceType || 1, nlbDest: nlbDest || '',
                stopInfo: stopInfo || await fetchStopName(stopId, company),
                altStopName: null
            };
            const key = makeStopKey(sd);
            const idx = currentStops.findIndex(s => makeStopKey(s) === key);
            if (idx >= 0) currentStops.splice(idx, 1);
            else currentStops.push(sd);
            saveStopsToStorage(); closeStopSelector(); updateClearButton();
            isFirstRender = true; renderedRows.clear();
            if (currentStops.length > 0) fetchMultiETA();
        }

        document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeStopSelector(); if (isFullscreenMode) toggleFullscreenMode(); } });

        loadThemePreference();
        const hadSaved = loadStopsFromStorage();
        if (hadSaved && currentStops.length > 0) setTimeout(() => fetchMultiETA(), 500);
    </script>
</body>

</html>
